<style>

html,body{height:100%;margin:0;overflow:hidden;background:#070b12;color:var(--parch);font-family:"Rubik","Segoe UI",sans-serif;font-size:16px;-webkit-font-smoothing:antialiased}
.font-display{font-family:"Unbounded","Rubik",sans-serif;letter-spacing:.01em}
.font-700{font-weight:700}.font-800{font-weight:800}
.clip-angled{clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.clip-angled-sm{clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px)}
.panel{background:linear-gradient(180deg,rgba(24,32,48,.94),rgba(11,16,26,.94));border:1px solid #38466a;box-shadow:0 6px 22px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.06)}

.panel-angled{background:linear-gradient(180deg,rgba(22,30,46,.95),rgba(10,14,24,.95));border:1px solid #38466a;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
button{font-family:inherit;cursor:pointer}
.btn-war{font-family:"Unbounded",sans-serif;font-weight:800;letter-spacing:.06em;color:#241703;background:linear-gradient(180deg,#f5d67b 0,#d9a441 45%,#a8762a 100%);border:1px solid #7c5a1e;clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);filter:drop-shadow(0 4px 0 #6b4d18) drop-shadow(0 10px 22px rgba(217,164,65,.35));transition:transform .13s,filter .13s;text-shadow:0 1px 0 rgba(255,255,255,.35)}

.btn-war:active{transform:translateY(2px);filter:drop-shadow(0 1px 0 #6b4d18) drop-shadow(0 4px 10px rgba(217,164,65,.3))}

.btn-iron{font-family:"Unbounded",sans-serif;font-weight:700;letter-spacing:.05em;color:#d6deee;background:linear-gradient(180deg,#33405c 0,#202a40 60%,#151c2c 100%);border:1px solid #4a5a7d;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);filter:drop-shadow(0 3px 0 #0d1220);transition:transform .13s,filter .13s}
.btn-iron:hover{filter:drop-shadow(0 4px 0 #0d1220) brightness(1.2);transform:translateY(-1px)}
.btn-iron:active{transform:translateY(1px);filter:drop-shadow(0 1px 0 #0d1220)}
.kbd{font-family:"Rubik",sans-serif;font-weight:700;font-size:12px;color:#f0e6c8;background:linear-gradient(180deg,#3a4560,#232c42);border:1px solid #55648a;border-bottom-width:3px;border-radius:5px;padding:2px 8px;white-space:nowrap}
@keyframes bannerIn{0%{transform:translateX(-70px) skewX(-10deg);opacity:0}12%{transform:translateX(0) skewX(-10deg);opacity:1}85%{transform:translateX(0) skewX(-10deg);opacity:1}100%{transform:translateX(70px) skewX(-10deg);opacity:0}}
.anim-banner{animation:bannerIn 2.3s cubic-bezier(.2,1,.3,1) both}
@keyframes riseIn{from{transform:translateY(22px);opacity:0}to{transform:translateY(0);opacity:1}}
.anim-rise{animation:riseIn .5s cubic-bezier(.2,1.2,.3,1) both}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-fade{animation:fadeIn .35s ease both}
@keyframes popIn{0%{transform:scale(.85);opacity:0}100%{transform:scale(1);opacity:1}}
.anim-pop{animation:popIn .26s cubic-bezier(.2,1.4,.4,1) both}
@keyframes slideInLeft{from{transform:translateX(-36px);opacity:0}to{transform:translateX(0);opacity:1}}
.anim-slide{animation:slideInLeft .5s cubic-bezier(.2,1.1,.3,1) both}
@keyframes emberUp{0%{transform:translateY(0) translateX(0);opacity:0}12%{opacity:.9}100%{transform:translateY(-46vh) translateX(var(--drift,20px));opacity:0}}
.ember{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:radial-gradient(circle,#ffe2a0 0,#e8912b 55%,rgba(232,145,43,0) 75%);animation:emberUp linear infinite;pointer-events:none}
@keyframes goldPulse{0%,100%{filter:drop-shadow(0 4px 0 #6b4d18) drop-shadow(0 10px 22px rgba(217,164,65,.35))}50%{filter:drop-shadow(0 4px 0 #6b4d18) drop-shadow(0 12px 40px rgba(245,214,123,.65))}}
.anim-goldpulse{animation:goldPulse 2.2s ease-in-out infinite}
@keyframes blinkReady{0%,100%{outline-color:rgba(245,214,123,.9)}50%{outline-color:rgba(245,214,123,.25)}}
.anim-blinkready{outline:2px solid rgba(245,214,123,.9);animation:blinkReady 1s ease-in-out infinite}

.anim-titleglow{animation:titleGlow 3.2s ease-in-out infinite}
@keyframes tickFlash{0%,100%{color:#f0e2bd}50%{color:#ff6a4d}}
.anim-tick{animation:tickFlash .5s step-end infinite}
@keyframes pulseGlow{0%,100%{box-shadow:0 0 12px rgba(255,140,59,.25)}50%{box-shadow:0 0 22px rgba(255,140,59,.55)}}

*::-webkit-scrollbar{width:9px;height:9px}
*::-webkit-scrollbar-track{background:#0d1220}
*::-webkit-scrollbar-thumb{background:#3a4763;border-radius:5px}

canvas.game-canvas{touch-action:none;display:block;cursor:crosshair}
input[type=range]{accent-color:#d9a441}

</head>

/* ============================================================
   ЗОЛОТО И ПОРОХ — вся игра в одном файле (vanilla JS)
   ============================================================ */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(seed){let a=seed>>>0;return()=>{a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296};}

  function tone(freq,dur,type,vol,slideTo,delay){

    const t0=ctx.currentTime+delay,o=ctx.createOscillator(),g=ctx.createGain();

  // ---- фоновая музыка: весёлый боевой фолк-рок, 138 BPM ----
  let musicTimer=null,musicStep=0,musicOn=false;
  const CHORDS=[[220,261.6,329.6],[261.6,329.6,392],[174.6,220,261.6],[196,246.9,293.7]];
  const BASSLINE=[0,0,12,0,0,0,12,7];
  const MELODY=[0,3,7,12,7,3,5,3, 0,3,7,12,15,12,7,3, 5,8,12,15,12,8,7,5, 7,5,3,2,3,-1,-1,-1];
  function playStep(step){
    const bar=Math.floor(step/8)%4, s=step%8, root=CHORDS[bar][0];
    if(s===0||s===4) noise(0.09,0.5,150,1,0,60);

    if(s%2===0)noise(0.03,0.07,8000,1);
    if(s%2===1)noise(0.03,0.05,9000,1);

const STORE_KEY="zoloto_poroh_workshop_v1";
function loadWorkshop(){try{const raw=localStorage.getItem(STORE_KEY);return raw?JSON.parse(raw):{};}catch(e){return{};}}
function saveWorkshop(data){try{localStorage.setItem(STORE_KEY,JSON.stringify(data));return true;}catch(e){return false;}}
function processImageFile(file){
  return new Promise((resolve,reject)=>{
    if(!file.type.startsWith("image/")){reject(new Error("not image"));return;}
    const rd=new FileReader();
    rd.onload=()=>{const img=new Image();
      img.onload=()=>{const MAX=512;let w=img.width,h=img.height;
        const k=Math.min(1,MAX/Math.max(w,h));w=Math.round(w*k);h=Math.round(h*k);
        const cv=document.createElement("canvas");cv.width=w;cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        resolve({dataUrl:cv.toDataURL("image/png"),aspect:w/h});};
      img.onerror=reject;img.src=rd.result;};
    rd.onerror=reject;rd.readAsDataURL(file);
  });
}

class Engine{

    this.moveInput=0;this.moveLeft=0;this.moveMax=BASE_MOVE;
    this.aimAngle=-Math.PI/4;this.charging=false;this.power=0;
    this.blinkMode=false;this.shopOpen=false;
    this.shake=0;this.redFlash=0;this.whiteFlash=0;this.time=0;this.uiAcc=0;this.settleT=0;
    this.ai={stage:"done",t:0,dur:0,dir:0,angle:0,speed:0};
    this.spriteCfg=loadWorkshop();this.sprites=new Map();
    for(const k of Object.keys(this.spriteCfg))this.loadSpriteImg(k,this.spriteCfg[k].dataUrl);
    this.cw=0;this.ch=0;this.scale=1;this.dpr=1;
    this.camX=WORLD_W/2;this.camY=WORLD_H/2;this.zoom=1.6;this.zoomMin=1;
    this.panning=null;this.raft={x:WORLD_W/2,dir:1,dx:0};
    this.destroyed=false;
    const sr=mulberry32(777);
    for(let i=0;i<240;i++)this.stars.push({x:sr()*WORLD_W*1.2-WORLD_W*0.1,y:sr()*900-560,s:0.5+sr()*1.5,tw:sr()*Math.PI*2});
    for(let i=0;i<9;i++)this.brightStars.push({x:sr()*WORLD_W,y:20+sr()*260,s:1.6+sr()*1.4,tw:sr()*Math.PI*2});
    const nebCols=["rgba(120,80,200,0.05)","rgba(60,140,190,0.05)","rgba(190,90,60,0.045)"];
    for(let i=0;i<3;i++)this.nebulae.push({x:200+sr()*(WORLD_W-400),y:40+sr()*200,r:150+sr()*160,color:nebCols[i]});
    for(let i=0;i<40;i++)this.embers.push({x:sr()*WORLD_W,y:sr()*WORLD_H,vy:12+sr()*26,drift:sr()*30-15,size:1+sr()*2.2,phase:sr()*10});
    this.genTerrain(42);
    this.bind();this.resize();
    this.lastT=performance.now();
    const loop=(t)=>{if(this.destroyed)return;
      const dt=clamp((t-this.lastT)/1000,0,0.033);this.lastT=t;this.time+=dt;
      if(!this.paused)this.update(dt);
      this.render();this.raf=requestAnimationFrame(loop);};
    this.raf=requestAnimationFrame(loop);
    this.emit();
  }
  destroy(){this.destroyed=true;cancelAnimationFrame(this.raf);}

  /* ---------- ввод ---------- */
  toLogical(cx,cy){const r=this.canvas.getBoundingClientRect();const S=this.scale*this.zoom;
    return{x:(cx-r.left-this.cw/2)/S+this.camX,y:(cy-r.top-this.ch/2)/S+this.camY};}
  bind(){
    this._kd=(e)=>this.onKeyDown(e);this._ku=(e)=>this.onKeyUp(e);this._rs=()=>this.resize();
    this._cm=(e)=>e.preventDefault();
    this._pd=(e)=>this.onPointerDown(e);this._pm=(e)=>this.onPointerMove(e);
    this._pu=()=>this.onPointerUp();this._wh=(e)=>this.onWheel(e);
    window.addEventListener("keydown",this._kd);window.addEventListener("keyup",this._ku);
    window.addEventListener("resize",this._rs);
    this.canvas.addEventListener("pointerdown",this._pd);this.canvas.addEventListener("pointermove",this._pm);
    this.canvas.addEventListener("pointerup",this._pu);this.canvas.addEventListener("pointercancel",this._pu);
    this.canvas.addEventListener("contextmenu",this._cm);
    this.canvas.addEventListener("wheel",this._wh,{passive:false});
  }
  onKeyDown(e){
    if(this.screen!=="game")return;const k=e.code;
    if(k==="Escape"||k==="KeyP"){this.togglePause();e.preventDefault();return;}
    if(this.paused)return;
    if(k==="KeyA"||k==="ArrowLeft")this.moveInput=-1;
    else if(k==="KeyD"||k==="ArrowRight")this.moveInput=1;
    else if(k==="KeyW"||k==="Space"||k==="ArrowUp"){this.jump();e.preventDefault();}
    else if(/^Digit[1-8]$/.test(k)){const h=this.cur();
      if(h&&h.team===0&&this.phase==="aim"){const slots=[h.sig,...ARMORY_IDS];const idx=parseInt(k.slice(5),10)-1;if(slots[idx])this.setWeapon(slots[idx]);}}
    else if(k==="KeyQ"){this.toggleUltAim();e.preventDefault();}
    else if(k==="KeyE"){if(this.phase==="aim"&&this.cur().team===0){if(this.shopOpen){this.shopOpen=false;this.onShopClose&&this.onShopClose();}else this.onShopOpen&&this.onShopOpen();this.emit();}}
  }
  onKeyUp(e){const k=e.code;
    if((k==="KeyA"||k==="ArrowLeft")&&this.moveInput===-1)this.moveInput=0;
    if((k==="KeyD"||k==="ArrowRight")&&this.moveInput===1)this.moveInput=0;}
  onWheel(e){if(this.screen!=="game")return;e.preventDefault();
    const f=e.deltaY<0?1.13:0.885;
    this.zoom=clamp(this.zoom*f,this.zoomMin,Math.max(3.2,this.zoomMin));this.camClamp();}
  onPointerDown(e){
    if(this.screen!=="game"||this.paused||this.shopOpen)return;
    if(e.button===2){this.panning={x:e.clientX,y:e.clientY};this.canvas.setPointerCapture(e.pointerId);return;}
    if(this.phase!=="aim"||this.cur().team!==0)return;
    sfx.ensure();const p=this.toLogical(e.clientX,e.clientY);
    if(this.ultAim){this.ultAimAt(p.x,p.y);return;}
    if(this.blinkMode){this.tryBlink(p.x,p.y);return;}
    this.updateAim(p.x,p.y);
    const def=weaponById[this.cur().weapon];
    if(def.kind==="melee"||def.kind==="beam"){this.fire();return;}
    this.charging=true;this.power=0;this.canvas.setPointerCapture(e.pointerId);
  }
  onPointerMove(e){
    if(this.screen!=="game")return;
    if(this.panning){const S=this.scale*this.zoom;
      this.camX-=(e.clientX-this.panning.x)/S;this.camY-=(e.clientY-this.panning.y)/S;
      this.panning.x=e.clientX;this.panning.y=e.clientY;this.camClamp();return;}
    const p=this.toLogical(e.clientX,e.clientY);this.updateAim(p.x,p.y);
  }
  onPointerUp(){if(this.panning){this.panning=null;return;}
    if(this.charging){this.charging=false;if(this.power>0.06)this.fire();else this.power=0;}}
  resize(){
    const w=window.innerWidth,h=window.innerHeight;
    this.dpr=Math.min(window.devicePixelRatio||1,2);
    this.canvas.width=Math.round(w*this.dpr);this.canvas.height=Math.round(h*this.dpr);
    this.canvas.style.width=w+"px";this.canvas.style.height=h+"px";
    this.cw=w;this.ch=h;
    this.scale=Math.min(w/WORLD_W,h/WORLD_H);
    const sNeed=Math.max(w/WORLD_W,h/WORLD_H);
    this.zoomMin=Math.max(1,sNeed/this.scale);
    this.zoom=clamp(this.zoom,this.zoomMin,Math.max(3.2,this.zoomMin));
    this.camClamp();
  }
  camClamp(){if(!this.scale)return;const S=this.scale*this.zoom;
    const vw=this.cw/S,vh=this.ch/S;
    this.camX=vw>=WORLD_W?WORLD_W/2:clamp(this.camX,vw/2,WORLD_W-vw/2);
    this.camY=vh>=WORLD_H?WORLD_H/2:clamp(this.camY,vh/2,WORLD_H-vh/2);}

  /* ---------- публичное API ---------- */
  startGame(diff,map,mode){
    sfx.ensure();sfx.startMusic();
    this.difficulty=diff;this.map=map;this.mode=mode;this.screen="game";
    this.paused=false;this.winner=null;

    this.projs=[];this.crates=[];this.particles=[];this.dmgNums=[];this.fires=[];this.beams=[];
    this.pulls=[];this.decals=[];this.turrets=[];this.mines=[];this.zones=[];this.skyStrikes=[];this.iceBlasts=[];
    this.ultAim=null;this.blinkMode=false;this.charging=false;
    this.shake=0;this.redFlash=0;this.whiteFlash=0;this.turnCount=-1;
    this.genTerrain(Math.floor(rand(1,99999)));
    this.spawnHeroes();this.spawnCrate();
    this.camX=this.heroes[0].x;this.camY=WORLD_H/2;this.zoom=1.6;this.camClamp();
    this.nextTurn();
  }
  toMenu(){this.screen="menu";this.heroes=[];this.order=[];this.projs=[];this.crates=[];
    this.dmgNums=[];this.fires=[];this.beams=[];this.turrets=[];this.mines=[];this.zones=[];
    this.skyStrikes=[];this.iceBlasts=[];this.blinkMode=false;this.paused=false;
    this.genTerrain(Math.floor(rand(1,99999)));sfx.click();this.emit();}
  togglePause(){
    if(this.screen!=="game"||this.winner!==null)return;
    if(this.shopOpen){this.shopOpen=false;this.onShopClose&&this.onShopClose();sfx.click();this.emit();return;}
    this.paused=!this.paused;
    if(this.paused){this.charging=false;this.moveInput=0;}
    sfx.click();this.emit();
  }
  toggleMute(){sfx.ensure();sfx.setMuted(!sfx.muted);this.emit();}
  setShopOpen(open){this.shopOpen=open;if(open){this.charging=false;this.blinkMode=false;}this.emit();}
  setMove(dir){if(this.screen==="game"&&this.phase==="aim"&&this.cur().team===0)this.moveInput=dir;}
  setWeapon(id){
    if(this.screen!=="game")return;const h=this.cur();
    if(this.phase!=="aim"||h.team!==0)return;
    const slots=[h.sig,...ARMORY_IDS];if(!slots.includes(id))return;
    const def=weaponById[id];
    if(def.ammo!==-1&&(h.ammo[id]||0)<=0){sfx.click();return;}
    if(h.weapon===id)return;
    h.weapon=id;this.charging=false;this.power=0;sfx.click();this.emit();
  }
  jump(){
    if(this.screen!=="game"||this.phase!=="aim")return;const h=this.cur();
    if(h.team!==0)return;

    for(let i=0;i<6;i++)this.particles.push({x:h.x+rand(-6,6),y:h.y,vx:rand(-40,40),vy:rand(10,60),life:0.4,max:0.4,size:2,color:"#8a7a5a",grav:200,kind:"smoke"});
    this.emit();
  }
  endTurn(){
    if(this.screen!=="game"||this.paused)return;
    if(this.phase!=="aim"||this.cur().team!==0)return;
    this.charging=false;this.blinkMode=false;this.ultAim=null;this.moveInput=0;
    this.phase="settle";this.settleT=0.35;sfx.click();this.emit();
  }
  toggleBlink(){const h=this.cur();
    if(this.phase!=="aim"||h.team!==0||!this.canBlink(h))return;
    this.blinkMode=!this.blinkMode;sfx.click();this.emit();}
  useMek(){const h=this.cur();
    if(this.phase!=="aim"||h.team!==0||h.mek<=0||h.hp>=h.maxHp)return;
    if(h.healBlock>0){this.dmgNums.push({x:h.x,y:h.y-80,life:1.2,text:"Хил заблокирован!",color:"#9fdcff",size:14});sfx.click();return;}
    h.mek--;h.hp=Math.min(h.maxHp,h.hp+45);sfx.heal();
    this.dmgNums.push({x:h.x,y:h.y-88,life:1.2,text:"+45",color:"#7ee08a",size:17});
    for(let i=0;i<12;i++)this.particles.push({x:h.x+rand(-10,10),y:h.y-rand(0,30),vx:rand(-25,25),vy:rand(-70,-25),life:0.8,max:0.8,size:2.5,color:"#7ee08a",grav:-30,kind:"heal"});
    this.emit();}
  buyItem(id){
    if(this.phase!=="aim"||this.cur().team!==0)return false;
    const def=ITEMS.find(i=>i.id===id);const h=this.cur();if(!def)return false;
    if(this.teamGold[0]<def.cost)return false;
    if(!def.consumable&&h.items.has(id))return false;
    this.teamGold[0]-=def.cost;
    if(def.consumable)h.mek++;else h.items.add(id);
    sfx.buy();this.dmgNums.push({x:h.x,y:h.y-88,life:1.2,text:def.name,color:"#f5d67b",size:13});
    this.emit();return true;
  }
  /* мастерская */
  getWorkshopData(){return this.spriteCfg;}
  applySprite(key,cfg){
    if(cfg){this.spriteCfg[key]=cfg;this.loadSpriteImg(key,cfg.dataUrl);}
    else{delete this.spriteCfg[key];this.sprites.delete(key);}
    const ok=saveWorkshop(this.spriteCfg);this.emit();return ok;
  }
  loadSpriteImg(key,dataUrl){const img=new Image();
    img.onload=()=>{this.sprites.set(key,img);this.emit();};img.src=dataUrl;}
  spriteOf(key){const cfg=this.spriteCfg[key],img=this.sprites.get(key);
    if(!cfg||!img||!img.complete||img.naturalWidth===0)return null;return{img,cfg};}

  /* ---------- ландшафт ---------- */
  genTerrain(seed){
    const rng=mulberry32(seed);
    const oct=(step)=>{const n=Math.ceil(WORLD_W/step)+2;const anch=[];
      for(let i=0;i<n;i++)anch.push(rng());
      return(x)=>{const f=x/step;const i=Math.floor(f);const t=(1-Math.cos((f-i)*Math.PI))/2;return lerp(anch[i],anch[i+1],t);};};
    const o1=oct(190),o2=oct(62),o3=oct(24);
    const m=this.map;
    const P={canyon:[250,90,16,2],frost:[300,120,30,1],jungle:[220,70,14,2],inferno:[320,140,40,1]}[m];
    this.o2fn=o2;
    for(let x=0;x<WORLD_W;x++){
      let h=470+(o1(x)-0.5)*P[0]+(o2(x)-0.5)*P[1]+(o3(x)-0.5)*P[2];
      this.heights[x]=clamp(h,260,720);
    }
    for(let p=0;p<P[3];p++)for(let x=2;x<WORLD_W-2;x++)
      this.heights[x]=(this.heights[x-2]+this.heights[x]*2+this.heights[x+2])/4;
    if(m==="frost"||m==="inferno"){ // рваные пики и провалы
      for(let i=0;i<26;i++){const cx=rng()*WORLD_W,w=12+rng()*30;
        const amp=(rng()<0.55?-1:1)*(18+rng()*42);
        for(let x=Math.max(2,Math.floor(cx-w));x<=Math.min(WORLD_W-3,Math.ceil(cx+w));x++){
          const t=1-Math.abs(x-cx)/w;this.heights[x]=clamp(this.heights[x]+amp*t*t,260,720);}}
    }
    // центральное озеро: плоское дно + плавные берега
    const cx=WORLD_W/2;
    for(let x=cx-340;x<=cx+340;x++){
      if(x<2||x>WORLD_W-3)continue;
      const d=Math.abs(x-cx);let target;
      if(d<=130)target=688+Math.sin(x*0.11)*2.4;
      else{const t=(d-130)/210;const s=t*t*(3-2*t);
        target=lerp(688,this.heights[x],s)+(o2(x)-0.5)*30*s;}
      this.heights[x]=clamp(target,260,720);
    }
    this.waterY=674;
    // площадки спаунов
    const fracs=this.spawnFracs();
    for(const team of[0,1])for(const fr of fracs[team]){
      const sx=Math.round(fr*WORLD_W);
      const base=this.heights[clamp(sx,0,WORLD_W-1)];
      for(let x=sx-40;x<=sx+40;x++){if(x<4||x>WORLD_W-5)continue;
        const t=1-Math.abs(x-sx)/40;
        this.heights[x]=Math.min(640,lerp(this.heights[x],base,t*0.85));}
    }
    // деревья (вне озера)
    this.trees=[];
    for(const side of[0,1])for(let i=0;i<8;i++){
      const x=side===0?rand(90,WORLD_W/2-380):rand(WORLD_W/2+380,WORLD_W-90);
      this.trees.push({x,baseY:this.surface(x),side,s:rand(1.15,1.75),seed:rng()*100,alive:true});
    }
    // декорации по картам
    this.stalactites=[];this.stalagmites=[];this.vines=[];this.firePillars=[];this.hellSpikes=[];this.fireflies=[];
    if(m==="frost"){
      for(let i=0;i<22;i++)this.stalactites.push({x:rng()*WORLD_W,w:10+rng()*22,len:40+rng()*120,lean:(rng()-0.5)*0.25});
      for(let i=0;i<16;i++){const x=60+rng()*(WORLD_W-120);const sy=this.surface(x);
        if(sy<WORLD_H-60&&Math.abs(x-WORLD_W/2)>380)this.stalagmites.push({x,w:8+rng()*14,len:22+rng()*46,lean:(rng()-0.5)*0.3});}
    }
    if(m==="jungle"){
      for(let i=0;i<26;i++)this.vines.push({x:rng()*WORLD_W,len:60+rng()*160,ph:rng()*10});
      for(let i=0;i<40;i++)this.fireflies.push({x:rng()*WORLD_W,y:200+rng()*500,ph:rng()*10});
    }
    if(m==="inferno"){
      for(let i=0;i<10;i++)this.firePillars.push(140+rng()*(WORLD_W-280));
      for(let i=0;i<20;i++){const x=60+rng()*(WORLD_W-120);const sy=this.surface(x);
        if(sy<WORLD_H-60&&Math.abs(x-WORLD_W/2)>380)this.hellSpikes.push({x,w:7+rng()*12,len:20+rng()*40,lean:(rng()-0.5)*0.3});}
    }
    this.terrainDirty=true;
  }
  spawnFracs(){const n=this.mode,t0=[],t1=[];
    for(let i=0;i<n;i++){t0.push(0.06+(i*0.38)/Math.max(1,n-1));t1.push(0.56+(i*0.38)/Math.max(1,n-1));}
    return[t0,t1];}
  surface(x){return this.heights[clamp(Math.round(x),0,WORLD_W-1)];}
  updateLakeBounds(){
    const level=this.waterY,cx=Math.round(WORLD_W/2);
    if(this.heights[cx]<=level){this.hasLake=false;return;}
    let sa=cx,sb=cx;
    while(sa>1&&this.heights[sa-1]>level)sa--;
    while(sb<WORLD_W-2&&this.heights[sb+1]>level)sb++;
    this.lakeL=sa;this.lakeR=sb;this.hasLake=true;
  }
  waterLevelAt(x){if(!this.hasLake)return null;
    const xi=Math.round(x);if(xi<this.lakeL||xi>this.lakeR)return null;
    const sy=this.surface(xi);return sy>this.waterY?this.waterY:null;}
  inLake(x){return this.waterLevelAt(x)!==null;}
  carve(cx,cy,r){
    const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(WORLD_W-1,Math.ceil(cx+r));
    for(let x=x0;x<=x1;x++){const dx=x-cx;
      const s=Math.sqrt(Math.max(0,r*r-dx*dx));
      const top=cy-s,bot=cy+s;
      if(this.heights[x]>top&&this.heights[x]<bot)this.heights[x]=Math.min(WORLD_H+1400,bot);}
    this.terrainDirty=true;
  }
  smoothCrater(a,b){
    const x0=clamp(Math.floor(a),2,WORLD_W-3),x1=clamp(Math.ceil(b),2,WORLD_W-3);
    if(x1<=x0)return;
    for(let pass=0;pass<2;pass++)for(let x=x0;x<=x1;x++){
      if(this.heights[x]>WORLD_H)continue;
      const prev=this.heights[x-2]>WORLD_H?this.heights[x]:this.heights[x-2];
      const next=this.heights[x+2]>WORLD_H?this.heights[x]:this.heights[x+2];
      this.heights[x]=(prev+this.heights[x]*2+next)/4;}
    this.terrainDirty=true;
  }
  smashDecor(x,y,r){
    for(const t of this.trees)if(t.alive&&Math.hypot(t.x-x,t.baseY-y)<r*1.3){
      t.alive=false;
      for(let k=0;k<10;k++)this.particles.push({x:t.x+rand(-16,16),y:t.baseY-rand(10,60),vx:rand(-90,90),vy:rand(-160,-20),life:rand(0.5,1),max:1,size:rand(2,4),color:t.side===0?"#3f8a42":"#4a2a24",grav:500,kind:"chunk"});}
    this.stalagmites=this.stalagmites.filter(s=>{if(Math.hypot(s.x-x,this.surface(s.x)-y)<r){this.debrisFx(s.x,this.surface(s.x));return false;}return true;});
    this.hellSpikes=this.hellSpikes.filter(s=>{if(Math.hypot(s.x-x,this.surface(s.x)-y)<r){this.debrisFx(s.x,this.surface(s.x));return false;}return true;});
    this.stalactites=this.stalactites.filter(s=>{if(Math.abs(s.x-x)<r){this.debrisFx(s.x,s.len);return false;}return true;});
    this.vines=this.vines.filter(v=>!(Math.abs(v.x-x)<r&&y<v.len+40));
  }
  debrisFx(x,y){for(let k=0;k<6;k++)this.particles.push({x:x+rand(-8,8),y:y+rand(-8,8),vx:rand(-100,100),vy:rand(-120,40),life:rand(0.4,0.8),max:0.8,size:rand(1.6,3),color:"#8a98a8",grav:500,kind:"chunk"});}

  renderTerrainImage(){
    const c=this.terrainCanvas.getContext("2d");const H=WORLD_H,half=WORLD_W/2;
    c.clearRect(0,0,WORLD_W,H);
    const frost=this.map==="frost",jungle=this.map==="jungle",inferno=this.map==="inferno";
    const biomes=inferno?[
      {dirtTop:"#4a4038",dirtMid:"#322a24",dirtDeep:"#14100c",grass:"#8a7a6a",grassHi:"#b0a090",tufts:["#9a8a78","#7a6a5a","#a89880"]},
      {dirtTop:"#3e2e2a",dirtMid:"#281a16",dirtDeep:"#100a08",grass:"#a04a30",grassHi:"#c96a40",tufts:["#b05a3a","#8a4026","#c06a44"]},
    ]:jungle?[
      {dirtTop:"#5a4a2a",dirtMid:"#3e3018",dirtDeep:"#1c1206",grass:"#4a8a3a",grassHi:"#6ab04a",tufts:["#5ea048","#3e7a2e","#74b85a"]},
      {dirtTop:"#46402a",dirtMid:"#302a16",dirtDeep:"#161006",grass:"#2e6a30",grassHi:"#4a8a44",tufts:["#3e7a3a","#245a26","#4e8a48"]},
    ]:frost?[
      {dirtTop:"#a8d4e8",dirtMid:"#4a86b0",dirtDeep:"#122b46",grass:"#e8f4fb",grassHi:"#ffffff",tufts:["#f0f8fd","#cfe4f2","#e0eef8"]},
      {dirtTop:"#9fc4e0",dirtMid:"#3f74a0",dirtDeep:"#101f38",grass:"#e0eefb",grassHi:"#f6fbff",tufts:["#e8f2fb","#c4d8ee","#d8e8f6"]},
    ]:[
      {dirtTop:"#6b532f",dirtMid:"#4a3520",dirtDeep:"#241708",grass:"#7fae45",grassHi:"#a8d468",tufts:["#93c255","#6b9a3a","#86b84c"]},
      {dirtTop:"#57382e",dirtMid:"#3a251d",dirtDeep:"#180d09",grass:"#a34a2e",grassHi:"#c96a40",tufts:["#c05f3a","#8a4026","#a8512f"]},
    ];
    for(const side of[0,1]){
      const xa=side===0?0:half,xb=side===0?half:WORLD_W;const b=biomes[side];
      const segs=[];let s=-1;
      for(let x=xa;x<=xb;x++){const y=x<WORLD_W?this.heights[x]:H+99;
        if(y<H-0.5){if(s<0)s=x;}else if(s>=0){segs.push([s,x-1]);s=-1;}}
      if(!segs.length)continue;
      const g=c.createLinearGradient(0,240,0,H);
      g.addColorStop(0,b.dirtTop);g.addColorStop(0.35,b.dirtMid);g.addColorStop(1,b.dirtDeep);
      const pathAll=()=>{c.beginPath();
        for(const[a,e]of segs){c.moveTo(a,H+4);
          for(let x=a;x<=e;x+=2)c.lineTo(x,this.heights[x]);
          c.lineTo(e,H+4);c.closePath();}};
      pathAll();c.fillStyle=g;c.fill();
      // внутренности под clip
      c.save();pathAll();c.clip();
      c.fillStyle="rgba(0,0,0,0.12)";
      for(let y=300;y<H;y+=34){c.beginPath();
        for(let x=xa;x<=xb;x+=26)c.lineTo?0:0;
        c.moveTo(xa,y+Math.sin(ya(y))*4);
        for(let x=xa;x<=xb;x+=26)c.lineTo(x,y+Math.sin(x*0.02+y*0.7)*4);
        c.lineTo(xb,y+8);c.lineTo(xa,y+8);c.fill();}
      const rng=mulberry32(1234+side*991);
      for(let i=0;i<340;i++){const x=xa+rng()*(xb-xa);
        const y0=this.heights[clamp(Math.round(x),0,WORLD_W-1)];
        const y=y0+10+rng()*(H-y0);if(y>H-3||y0>=H)continue;
        c.fillStyle=rng()>0.5?"rgba(0,0,0,0.24)":"rgba(255,214,150,0.05)";
        c.fillRect(x,y,2,2);}
      for(let i=0;i<10;i++){const x=xa+rng()*(xb-xa);
        const y0=this.heights[clamp(Math.round(x),0,WORLD_W-1)];
        const y=y0+26+rng()*Math.max(10,H-y0-50);if(y>H-8||y0>=H)continue;
        const r=3+rng()*5;
        c.fillStyle="rgba(0,0,0,0.28)";c.beginPath();c.ellipse(x,y,r,r*0.72,0,0,Math.PI*2);c.fill();
        c.fillStyle="rgba(255,220,170,0.07)";c.beginPath();c.ellipse(x-r*0.25,y-r*0.3,r*0.5,r*0.34,0,0,Math.PI*2);c.fill();}
      if(inferno){c.strokeStyle="rgba(224,80,56,0.16)";c.lineWidth=1.5;
        for(let i=0;i<12;i++){let x=xa+rng()*(xb-xa);
          let y=this.heights[clamp(Math.round(x),0,WORLD_W-1)]+8;
          c.beginPath();c.moveTo(x,y);
          for(let k=0;k<5;k++){x+=(rng()-0.5)*22;y+=14+rng()*22;c.lineTo(x,y);}c.stroke();}}
      c.restore();
      // кромка
      c.lineWidth=7;c.strokeStyle="rgba(0,0,0,0.35)";
      for(const[a,e]of segs){c.beginPath();c.moveTo(a,this.heights[a]+3);
        for(let x=a;x<=e;x+=4)c.lineTo(x,this.heights[x]+3);c.stroke();}
      c.lineWidth=4;c.strokeStyle=b.grass;
      for(const[a,e]of segs){c.beginPath();c.moveTo(a,this.heights[a]);
        for(let x=a;x<=e;x+=4)c.lineTo(x,this.heights[x]);c.stroke();}
      c.lineWidth=1.4;c.strokeStyle=b.grassHi;
      for(const[a,e]of segs){c.beginPath();c.moveTo(a,this.heights[a]-2);
        for(let x=a;x<=e;x+=8)c.lineTo(x,this.heights[x]-2);c.stroke();}
      // декор кромки
      for(let x=xa+5;x<Math.min(xb,WORLD_W);x+=7){
        const y0=this.heights[x];if(y0>=H)continue;
        const r2=mulberry32(x*13+side*7);
        if(frost){
          if(x%16<7){c.fillStyle=r2()>0.4?b.tufts[0]:b.tufts[1];
            c.beginPath();c.ellipse(x,y0-1.2,7+r2()*5,3.2+r2()*2,0,Math.PI,0);c.fill();}
          if(x%23<7){c.fillStyle="rgba(255,255,255,0.75)";c.fillRect(x+r2()*6,y0-3-r2()*2,1.6,1.6);}
        }else{
          const n=2+Math.floor(r2()*2);
          for(let k=0;k<n;k++){c.strokeStyle=b.tufts[k%3];c.lineWidth=1.2;
            const bx=x+(k-n/2)*2.6+(r2()-0.5)*2,hgt=3+r2()*5.5;
            c.beginPath();c.moveTo(bx,y0);
            c.quadraticCurveTo(bx+(r2()-0.5)*2.5,y0-hgt*0.6,bx+(r2()-0.5)*4.5,y0-hgt);c.stroke();}
          const det=r2();
          if(jungle&&det>0.86){ // папоротник
            c.strokeStyle="#3e8a48";c.lineWidth=1.2;
            for(let k=-2;k<=2;k++){c.beginPath();c.moveTo(x,y0);
              c.quadraticCurveTo(x+k*3,y0-7,x+k*5.5,y0-10-Math.abs(k));c.stroke();}
          }else if(inferno){
            c.fillStyle=det>0.93?"rgba(255,120,50,0.6)":"rgba(220,210,190,0.5)";
            if(det>0.93){c.beginPath();c.ellipse(x-2,y0-1,2,1.2,0,0,Math.PI*2);c.fill();}
            else c.fillRect(x-4,y0-2.4,8,1.8);
          }else{
            if(side===0&&det>0.9){c.fillStyle=det>0.95?"#ffe9a0":"#f2f0e4";
              c.beginPath();c.arc(x+2,y0-7-det*3,1.4,0,Math.PI*2);c.fill();}
            if(side===1&&det>0.9){c.fillStyle="rgba(255,120,50,0.5)";
              c.beginPath();c.ellipse(x-2,y0-0.7,1.8,1.1,0,0,Math.PI*2);c.fill();}
          }
        }
      }
      if(inferno){c.strokeStyle="rgba(255,120,40,0.4)";c.lineWidth=1.6;
        for(let x=xa+20;x<Math.min(xb,WORLD_W)-20;x+=47){
          const y0=this.heights[x];if(y0>=H)continue;
          c.beginPath();c.moveTo(x,y0+2);c.lineTo(x+5,y0+8);c.lineTo(x+2,y0+14);c.stroke();}}
    }
    function ya(y){return y*0.13;}
    this.terrainDirty=false;
  }

  /* ---------- герои и ходы ---------- */
  lineZones(team){return team===0?[[0.05,0.17],[0.20,0.33],[0.35,0.47]]:[[0.53,0.65],[0.67,0.80],[0.83,0.95]];}
  linePlan(count){return count===4?[1,0,2,1]:[0,1,2,0,1,2,1,0,2,1];}
  spawnHeroes(){
    this.heroes=[];const plan=this.linePlan(this.mode);
    for(const team of[0,1]){
      const roster=this.mode===10?[...ROSTERS[team],...ROSTERS_EXTRA[team]]:ROSTERS[team];
      const zones=this.lineZones(team);const perLine=[0,0,0];
      roster.forEach(hid=>{
        const def=heroById[hid];
        const line=plan[this.heroes.filter(h=>h.team===team).length%plan.length];
        const za=zones[line][0],zb=zones[line][1];const slot=perLine[line]++;
        const span=(zb-za)*WORLD_W;
        const x=clamp(za*WORLD_W+(span/3)*slot+span*0.16+rand(-14,14),30,WORLD_W-30);
        const ammo={};
        for(const w of WEAPONS)if(w.ammo!==-1&&(ARMORY_IDS.includes(w.id)||w.id===def.sig))ammo[w.id]=w.ammo;
        this.heroes.push({team,heroId:def.id,type:def.archetype,name:def.name,sig:def.sig,ult:def.ult,line,
          x,y:this.surface(x),vy:0,hp:100,maxHp:100,alive:true,onGround:true,wet:false,
          items:new Set(),mek:0,blinkCd:0,usedBlink:false,flashT:0,walkPhase:0,swingT:0,
          weapon:def.sig,ammo,ultCd:0,usedUlt:false,shield:false,stunLeft:0,buffMult:1,healBlock:0,minesLeft:0});
      });
    }
    this.order=[];
    for(let i=0;i<this.mode;i++)this.order.push(this.heroes[i],this.heroes[this.mode+i]);
  }
  cur(){return this.order[this.curIdx];}
  canBlink(h){return h.items.has("blink")&&!h.usedBlink&&h.blinkCd<=0;}
  ultReady(h){return h.ultCd<=0&&!h.usedUlt&&h.stunLeft<=0;}
  nextTurn(){
    if(this.winner!==null)return;
    for(let step=0;step<this.order.length;step++){
      this.turnCount++;
      const idx=this.turnCount%this.order.length;
      if(this.order[idx].alive){this.curIdx=idx;this.beginTurn();return;}
    }
  }
  beginTurn(){
    const h=this.cur();
    const crateCap=this.mode===10?3:2;
    if(this.turnCount%this.order.length===0&&this.turnCount>0&&this.crates.length<crateCap)this.spawnCrate();

  aiShop(h){

    const perms=["blink","boots","ring","aghs"].filter(id=>!h.items.has(id));
    const aff=perms.filter(id=>ITEMS.find(i=>i.id===id).cost<=g);

  aiPlan(h){
    const enemies=this.heroes.filter(e=>e.team===0&&e.alive);

    else{const sorted=[...enemies].sort((a,b)=>a.hp-b.hp);

    let wid="cannon";

    else if(hasAmmo("cluster")&&Math.random()<0.18)wid="cluster";
    else if(hasAmmo("napalm")&&Math.random()<0.14)wid="napalm";
    else if(hasAmmo("dynamite")&&Math.random()<0.1)wid="dynamite";

  solveBallistic(x0,y0,tx,ty,g,vmax){
    const dx=tx-x0,dy=ty-y0;const adx=Math.max(40,Math.abs(dx));
    let v=clamp(26*Math.sqrt(adx)+240,340,vmax);
    for(let tries=0;tries<9;tries++){
      const a=(g*adx*adx)/(2*v*v);
      const disc=adx*adx-4*a*(a-dy);
      if(disc>=0){const T=(adx-Math.sqrt(disc))/(2*a);
        const base=Math.atan(T);
        return{angle:dx>0?-base:Math.PI+base,speed:v};}
      v+=110;if(v>vmax)break;}
    return{angle:dx>0?-1.15:Math.PI+1.15,speed:vmax};
  }
  aiUpdate(dt){

    }else if(this.ai.stage==="move"&&this.ai.t>=this.ai.dur){
      this.moveInput=0;this.ai.stage="aim";this.ai.t=0;this.ai.dur=0.55;
    }else if(this.ai.stage==="aim"){

  mkProj(x,y,angle,speed,def,team,mini,shooter,dmgMul){

  segDist(px,py,x1,y1,x2,y2){
    const dx=x2-x1,dy=y2-y1;const L2=dx*dx+dy*dy;
    let t=L2?((px-x1)*dx+(py-y1)*dy)/L2:0;t=clamp(t,0,1);

  doBeam(h,def){

  checkWin(){

  /* ---------- предметы ---------- */
  tryBlink(tx,ty){
    const h=this.cur();
    if(!this.canBlink(h)||this.phase!=="aim"||h.team!==0)return;
    let dx=tx-h.x,dy=ty-(h.y-16);
    const d=Math.hypot(dx,dy);
    if(d>BLINK_RADIUS){dx=(dx/d)*BLINK_RADIUS;}
    const nx=clamp(h.x+dx,18,WORLD_W-18);
    let ny=this.surface(nx);
    // в воду нельзя — но на плот можно
    const onRaftNow=Math.abs(this.raft.x-nx)<52;
    if(this.inLake(nx)&&!onRaftNow){
      this.dmgNums.push({x:nx,y:Math.min(ny,this.waterY)-20,life:1,text:"Там вода!",color:"#7fc4e8",size:13});
      return;}
    for(let i=0;i<14;i++){const a=rand(0,Math.PI*2),s=rand(30,140);
      this.particles.push({x:h.x,y:h.y-16,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.4,max:0.4,size:2.5,color:"#f5d67b",grav:0,kind:"tele"});

    h.x=nx;h.y=onRaftNow?this.waterY:ny;h.vy=0;h.onGround=true;
    h.usedBlink=true;h.blinkCd=2;this.blinkMode=false;

  ultAimAt(x,y){
    const h=this.cur();

    const m=ultById[h.ult].mechanic;
    if(m.k==="assassinate"){
      let target=null;
      for(const t of this.heroes)
        if(t.alive&&t.team!==h.team&&Math.hypot(t.x-x,t.y-HERO_CY-y)<40){target=t;break;}
      if(!target){this.dmgNums.push({x,y:y-20,life:0.9,text:"Цель не поймана!",color:"#c9c2ae",size:13});sfx.click();return;}
      this.ultAim=null;this.finishUlt(h);
      sfx.shoot();sfx.zap();
      this.beams.push({x1:h.x,y1:h.y-HERO_CY,x2:target.x,y2:target.y-HERO_CY,t:0.4});
      this.damageHero(target,m.dmg,h.team);
      for(let i=0;i<10;i++)this.particles.push({x:target.x+rand(-8,8),y:target.y-HERO_CY+rand(-10,10),vx:rand(-160,160),vy:rand(-200,40),life:0.4,max:0.4,size:2.4,color:"#ffe95c",grav:300,kind:"spark"});
      this.phase="settle";this.settleT=0.1;
    }else if(m.k==="sunstrike"){
      this.ultAim=null;this.finishUlt(h);sfx.zap();

      this.dmgNums.push({x,y:this.surface(clamp(x,0,WORLD_W-1))-70,life:1,text:"Прицел с неба!",color:"#ffd27b",size:14});}

  finishUlt(h){h.usedUlt=true;h.ultCd=ultById[h.ult].cd;
    this.dmgNums.push({x:h.x,y:h.y-110,life:1.3,text:ultById[h.ult].name.toUpperCase(),color:h.team===0?"#f5d67b":"#ff8c6b",size:15});}
  castUlt(h){
    if(!this.ultReady(h))return;
    const def=ultById[h.ult];const m=def.mechanic;
    const enemies=this.heroes.filter(t=>t.team!==h.team&&t.alive);
    this.finishUlt(h);sfx.zap();
    switch(m.k){
      case "assassinate":{
        const target=[...enemies].sort((p,q)=>p.hp-q.hp)[0];
        if(target){sfx.shoot();sfx.zap();
          this.beams.push({x1:h.x,y1:h.y-HERO_CY,x2:target.x,y2:target.y-HERO_CY,t:0.4});
          this.damageHero(target,m.dmg,h.team);
          for(let i=0;i<10;i++)this.particles.push({x:target.x+rand(-8,8),y:target.y-HERO_CY+rand(-10,10),vx:rand(-160,160),vy:rand(-200,40),life:0.4,max:0.4,size:2.4,color:"#ffe95c",grav:300,kind:"spark"});}
        break;}
      case "sunstrike":{
        const target=enemies[Math.floor(Math.random()*enemies.length)];
        if(target){sfx.zap();
          this.skyStrikes.push({x:target.x+rand(-20,20),y:this.surface(clamp(target.x,0,WORLD_W-1)),t:m.delay,dmg:m.dmg,radius:m.radius,team:h.team});}
        break;}
      case "global_bolt":{
        for(const t of enemies){
          this.beams.push({x1:t.x+rand(-14,14),y1:-40,x2:t.x,y2:t.y-HERO_CY,t:0.35});
          this.explodeAt(t.x,t.y-10,m.radius,m.dmg,h.team,"bolt");}
        this.whiteFlash=0.7;this.shake=Math.min(26,this.shake+14);sfx.explode(true);break;}
      case "turret":{
        for(let i=0;i<m.count;i++){
          const side=i%2===0?1:-1;
          const tx=clamp(h.x+side*(34+i*26),30,WORLD_W-30);
          this.turrets.push({owner:h,x:tx,y:this.surface(tx),shots:m.shots,dmg:m.dmg,next:0.5+i*0.4,
            kind:m.count===3?"serpent":m.count===2?"treant":"ward",t:0});}
        break;}
      case "mine":{
        for(let i=0;i<m.count;i++){
          const mx=clamp(h.x+(h.team===0?1:-1)*(60+i*70)+rand(-20,20),30,WORLD_W-30);
          this.mines.push({owner:h,x:mx,y:this.surface(mx),t:0});}
        h.minesLeft+=m.count;
        this.dmgNums.push({x:h.x,y:h.y-70,life:1.2,text:"Мины установлены!",color:"#e0c060",size:14});break;}
      case "dot_zone":{
        const dir=Math.cos(this.aimAngle)>=0?1:-1;
        const zx=clamp(h.x+dir*130,60,WORLD_W-60);
        this.zones.push({owner:h,x:zx,y:this.surface(zx),r:m.radius,dmg:m.dmg,t:0,dur:m.dur,next:0.25,kind:m.kind});
        break;}
      case "self_aoe":{
        this.explodeAt(h.x,h.y-20,m.radius,m.dmg,h.team,m.kind==="frost"?"ice":m.kind==="poison"?"poison":"pulse");
        if(m.kind==="poison"||m.kind==="frost")
          this.zones.push({owner:h,x:h.x,y:this.surface(h.x),r:m.radius*0.8,dmg:5,t:0,dur:3,next:0.5,kind:m.kind==="frost"?"arcane":"poison"});
        break;}
      case "stun":{
        let target=null,bd=1e9;
        for(const t of enemies){const d=Math.abs(t.x-h.x);if(d<520&&d<bd){bd=d;target=t;}}
        if(target){target.stunLeft=1;this.damageHero(target,m.dmg,h.team);
          this.beams.push({x1:h.x,y1:h.y-HERO_CY,x2:target.x,y2:target.y-HERO_CY,t:0.5});
          this.dmgNums.push({x:target.x,y:target.y-80,life:1.3,text:"ОГЛУШЁН",color:"#b07ae0",size:16});
        }else{this.dmgNums.push({x:h.x,y:h.y-70,life:1,text:"Никого в хватке…",color:"#c9c2ae",size:13});
          h.usedUlt=false;h.ultCd=0;}
        break;}
      case "buff":{
        h.buffMult=m.mult;
        this.dmgNums.push({x:h.x,y:h.y-70,life:1.3,text:"×2 УРОН!",color:"#f5d67b",size:16});break;}
      case "shield":{h.shield=true;
        this.dmgNums.push({x:h.x,y:h.y-70,life:1.3,text:"ЩИТ",color:"#e8d0f0",size:16});break;}
      case "ice_blast":{
        const dir=h.team===0?1:-1;
        this.iceBlasts.push({x:h.x+dir*30,y:h.y-HERO_CY-40,vx:dir*820,vy:-120,dmg:m.dmg,team:h.team,t:0});
        for(const t of enemies)t.healBlock=3;
        this.dmgNums.push({x:h.x,y:h.y-70,life:1.2,text:"Хил заблокирован!",color:"#9fdcff",size:13});break;}
      case "beam":{this.aimBeamUlt(h,m.dmg);break;}
      case "steal":{
        const dead=this.heroes.filter(t=>t.team!==h.team&&!t.alive);
        if(dead.length){h.ult=dead[dead.length-1].ult;
          this.dmgNums.push({x:h.x,y:h.y-70,life:1.3,text:"Украдено: "+ultById[h.ult].name,color:"#b09ae0",size:13});
        }else{this.dmgNums.push({x:h.x,y:h.y-70,life:1,text:"Нечего красть…",color:"#c9c2ae",size:13});
          h.usedUlt=false;h.ultCd=0;}
        break;}
    }
    this.phase="settle";this.settleT=0.15;this.emit();
  }
  aimBeamUlt(h,dmg){
    const a=this.aimAngle,dx=Math.cos(a),dy=Math.sin(a);
    const x0=h.x+dx*24,y0=h.y-HERO_CY+dy*24;
    let dist=0,x1=x0,y1=y0;
    while(dist<1600){dist+=6;x1=x0+dx*dist;y1=y0+dy*dist;
      if(x1<0||x1>WORLD_W-1)break;
      if(y1>=this.surface(x1)+2)break;}
    for(let s2=0;s2<=dist;s2+=10)this.carve(x0+dx*s2,y0+dy*s2,9);
    for(const t of this.heroes){
      if(!t.alive)continue;
      if(this.segDist(t.x,t.y-HERO_CY,x0,y0,x1,y1)<30){
        this.damageHero(t,dmg,h.team);t.vy=-200;t.onGround=false;}}
    this.beams.push({x1:x0,y1:y0,x2:x1,y2:y1,t:0.55});
    this.shake=Math.min(26,this.shake+10);
  }
  detonateMines(){
    const h=this.cur();
    if(this.phase!=="aim"||h.team!==0)return;
    const ms=this.mines.filter(mi=>mi.owner===h);
    if(!ms.length)return;
    for(const mi of ms)this.explode(mi.x,mi.y-8,55,45,h.team,undefined,{endTurn:false,quiet:true});
    this.mines=this.mines.filter(mi=>mi.owner!==h);
    h.minesLeft=0;sfx.explode(true);
    this.shake=Math.min(26,this.shake+12);
    this.phase="settle";this.settleT=0.1;this.emit();
  }
  updateUltEntities(dt){
    for(let i=this.turrets.length-1;i>=0;i--){
      const tu=this.turrets[i];tu.t+=dt;
      if(!tu.owner.alive){this.turrets.splice(i,1);continue;}
      tu.next-=dt;
      if(tu.next<=0&&tu.shots>0){
        tu.shots--;tu.next=0.55;
        const enemies=this.heroes.filter(h=>h.team!==tu.owner.team&&h.alive);
        if(enemies.length){
          const t=enemies[Math.floor(Math.random()*enemies.length)];
          this.beams.push({x1:tu.x,y1:tu.y-26,x2:t.x,y2:t.y-HERO_CY,t:0.25});
          this.damageHero(t,tu.dmg,tu.owner.team);sfx.shoot();}
        if(tu.shots<=0)this.turrets.splice(i,1);}}
    for(let i=this.mines.length-1;i>=0;i--){
      const mi=this.mines[i];mi.t+=dt;
      for(const h of this.heroes){
        if(h.alive&&h.team!==mi.owner.team&&Math.hypot(h.x-mi.x,h.y-mi.y)<34){
          this.explode(mi.x,mi.y-8,55,45,mi.owner.team,undefined,{endTurn:false,quiet:true});
          mi.owner.minesLeft=Math.max(0,mi.owner.minesLeft-1);
          this.mines.splice(i,1);sfx.explode(false);break;}}}
    for(let i=this.zones.length-1;i>=0;i--){
      const z=this.zones[i];z.t+=dt;z.next-=dt;
      const col=z.kind==="fire"?"#ff7a3b":z.kind==="poison"?"#7ee08a":"#b09ae0";
      if(Math.random()<dt*14)this.particles.push({x:z.x+rand(-z.r*0.5,z.r*0.5),y:z.y-rand(0,26),vx:rand(-20,20),vy:-rand(40,120),life:0.5,max:0.5,size:rand(2,4),color:col,grav:z.kind==="poison"?-30:-90,kind:"spark"});
      if(z.next<=0){z.next=0.5;
        for(const h of this.heroes)
          if(h.alive&&h.team!==z.owner.team&&Math.abs(h.x-z.x)<z.r&&h.y>z.y-90&&h.y<z.y+20)
            this.damageHero(h,z.dmg,z.owner.team);}
      if(z.t>=z.dur)this.zones.splice(i,1);}
    for(let i=this.skyStrikes.length-1;i>=0;i--){
      const s=this.skyStrikes[i];s.t-=dt;
      if(s.t<=0){

      if(hit||ib.y>sy||ib.x<-50||ib.x>WORLD_W+50){

  }
  /* ---------- главный update ---------- */
  update(dt){
    this.updateLakeBounds();
    for(const e of this.embers){e.y-=e.vy*dt;e.x+=Math.sin(this.time*0.7+e.phase)*e.drift*dt;
      if(e.y<-20){e.y=WORLD_H+10;e.x=rand(0,WORLD_W);}}
    for(const ff of this.fireflies){ff.x+=Math.sin(this.time*0.6+ff.ph)*12*dt;ff.y+=Math.cos(this.time*0.5+ff.ph*1.3)*9*dt;}
    if(this.map==="inferno"){this.pillarT-=dt;
      if(this.pillarT<=0&&this.firePillars.length){this.pillarT=rand(0.5,1.6);
        const px=this.firePillars[Math.floor(Math.random()*this.firePillars.length)];
        const gy=this.surface(px);
        for(let k=0;k<8;k++)this.particles.push({x:px+rand(-8,8),y:gy-rand(0,60),vx:rand(-25,25),vy:-rand(120,320),life:rand(0.4,0.9),max:0.9,size:rand(1.8,3.4),color:Math.random()<0.5?"#ffd66b":"#ff7a2a",grav:-60,kind:"spark"});}}
    if(this.screen!=="game")return;
    this.updateParticles(dt);
    this.shake*=Math.exp(-6.5*dt);
    this.redFlash*=Math.exp(-3.2*dt);
    this.whiteFlash*=Math.exp(-4.5*dt);
    for(let i=this.beams.length-1;i>=0;i--){this.beams[i].t-=dt;if(this.beams[i].t<=0)this.beams.splice(i,1);}
    for(let i=this.decals.length-1;i>=0;i--){this.decals[i].life-=dt;if(this.decals[i].life<=0)this.decals.splice(i,1);}
    for(const t of this.trees)
      if(t.alive&&this.surface(t.x)>t.baseY+26){t.alive=false;sfx.land();
        for(let k=0;k<10;k++)this.particles.push({x:t.x+rand(-16,16),y:t.baseY-rand(10,60),vx:rand(-70,70),vy:rand(-140,-20),life:rand(0.5,1),max:1,size:rand(2,4),color:t.side===0?"#3f8a42":"#4a2a24",grav:500,kind:"chunk"});}
    // плот
    const raftPrev=this.raft.x;
    this.raft.x+=this.raft.dir*62*dt;
    const cx=WORLD_W/2;
    if(this.raft.x>cx+268){this.raft.x=cx+268;this.raft.dir=-1;}
    if(this.raft.x<cx-268){this.raft.x=cx-268;this.raft.dir=1;}
    this.raft.dx=this.raft.x-raftPrev;
    if(Math.random()<dt*6)this.particles.push({x:this.raft.x-this.raft.dir*40,y:this.waterY+1,vx:-this.raft.dir*rand(10,40),vy:rand(-8,4),life:0.6,max:0.6,size:rand(2,4),color:"rgba(200,232,250,0.5)",grav:0,kind:"smoke"});
    // герои
    for(const h of this.heroes){
      if(this.pulls.some(pu=>pu.h===h))continue;
      if(!h.alive){if(h.y<WORLD_H+500)h.y=Math.min(this.surface(h.x),WORLD_H+500);continue;}
      h.flashT=Math.max(0,h.flashT-dt);
      h.swingT=Math.max(0,h.swingT-dt);
      const onRaft=Math.abs(h.x-this.raft.x)<46&&Math.abs(h.y-this.waterY)<10;
      if(onRaft){h.x=clamp(h.x+this.raft.dx,18,WORLD_W-18);h.y=this.waterY;h.onGround=true;}
      const sy=this.surface(h.x);
      const isActive=h===this.cur()&&(this.phase==="aim"||this.phase==="ai");
      if(!h.onGround||h.y<sy-0.5){
        h.onGround=false;h.vy+=GRAVITY*0.92*dt;h.y+=h.vy*dt;
        if(h.y>=sy&&sy<WORLD_H){
          const impact=h.vy;h.y=sy;h.vy=0;h.onGround=true;sfx.land();
          if(impact>640){const fdmg=Math.round((impact-640)*0.055);
            if(fdmg>0){this.dmgNums.push({x:h.x,y:h.y-70,life:1,text:"−"+fdmg,color:"#c9b8ff",size:13});
              h.hp-=fdmg;h.flashT=0.15;
              if(h.hp<=0){h.hp=0;h.alive=false;
                this.dmgNums.push({x:h.x,y:h.y-98,life:1.5,text:"РАЗБИЛСЯ",color:"#ff4433",size:14});
                this.checkWin();}}}}
      }else{
        h.y=sy;
        if(isActive&&this.moveInput!==0&&this.moveLeft>0){
          const speed=150;const step=Math.min(speed*dt,this.moveLeft);
          h.x=clamp(h.x+this.moveInput*step,18,WORLD_W-18);
          h.y=this.surface(h.x);
          this.moveLeft-=step;h.walkPhase+=dt*11;
          if(Math.random()<dt*8)this.particles.push({x:h.x-this.moveInput*6,y:h.y,vx:rand(-14,14),vy:rand(-26,-6),life:0.4,max:0.4,size:2,color:"rgba(120,105,80,0.5)",grav:60,kind:"smoke"});}}
      if(h.alive&&h.y>LAVA_TOP){this.lavaKill(h);continue;}
      // вода топит: без плота герой мгновенно тонет
      if(h.alive&&!onRaft&&this.inLake(h.x)&&h.y>=this.waterY-4){this.drownKill(h);continue;}
    }
    // притяжение крюком
    for(let i=this.pulls.length-1;i>=0;i--){
      const pu=this.pulls[i];pu.t+=dt*1.8;
      const t=Math.min(1,pu.t);
      pu.h.x=lerp(pu.fromX,pu.toX,t);
      pu.h.y=lerp(pu.fromY,this.surface(pu.toX)-2,t)-Math.sin(t*Math.PI)*70;
      if(t>=1){pu.h.onGround=true;pu.h.vy=0;this.pulls.splice(i,1);sfx.land();}}
    // ящики
    for(let i=this.crates.length-1;i>=0;i--){
      const c=this.crates[i];
      if(!c.landed){
        c.vy=Math.min(c.vy+160*dt,120);c.y+=c.vy*dt;
        const sy=this.surface(c.x);
        if(c.y>=sy-10&&sy<WORLD_H){c.y=sy-10;c.landed=true;}
        const cwl=this.waterLevelAt(c.x);
        if(cwl!==null&&c.y>cwl){this.waterSplash(c.x);this.crates.splice(i,1);continue;}
        if(c.y>LAVA_TOP){this.lavaSplash(c.x);this.crates.splice(i,1);}
      }else{
        const sy=this.surface(c.x);
        if(sy>=WORLD_H||sy-10>c.y+14){c.landed=false;c.vy=0;}
        else if(this.waterLevelAt(c.x)!==null&&sy>this.waterY+6){this.waterSplash(c.x);this.crates.splice(i,1);}}}
    // очаги напалма
    for(let i=this.fires.length-1;i>=0;i--){
      const f=this.fires[i];f.t+=dt;
      const k=Math.max(0,1-f.t/f.dur);
      this.particles.push({x:f.x+rand(-f.r*0.55,f.r*0.55),y:f.y-2,vx:rand(-18,18),vy:-rand(70,190),life:rand(0.3,0.65),max:0.65,size:rand(2,4.4)*k+1,color:["#ffd66b","#ffb054","#ff6a2a"][Math.floor(rand(0,3))],grav:-140,kind:"spark"});
      f.next-=dt;
      if(f.next<=0){f.next=0.5;
        for(const h of this.heroes)
          if(h.alive&&Math.abs(h.x-f.x)<f.r*0.72&&h.y>f.y-80&&h.y<f.y+26)this.damageHero(h,7,f.team);
        for(let ci=this.crates.length-1;ci>=0;ci--){const cr=this.crates[ci];
          if(Math.abs(cr.x-f.x)<f.r*0.7&&Math.abs(cr.y-f.y)<40)this.openCrate(ci,f.team);}}
      if(f.t>=f.dur)this.fires.splice(i,1);}
    // снаряды
    if(this.projs.length)this.updateProjectiles(dt);
    this.updateUltEntities(dt);
    // фазы
    if((this.phase==="aim"||this.phase==="ai")&&!this.cur().alive){this.phase="settle";this.settleT=0.35;}
    if(this.phase==="aim"){
      const h=this.cur();
      if(h.team===0&&!this.shopOpen){
        this.timer-=dt;
        const s=Math.ceil(this.timer);
        if(s<=5&&s!==this.lastTickSec&&s>0){sfx.tick();this.lastTickSec=s;}
        if(this.timer<=0){this.timer=0;this.endTurn();return;}}
      if(this.charging)this.power=Math.min(1,this.power+dt/1.15);
    }else if(this.phase==="ai")this.aiUpdate(dt);
    else if(this.phase==="settle"){
      const settled=this.heroes.every(h=>!h.alive||h.onGround);
      this.settleT+=dt;
      const hurry=!this.cur().alive;
      if((settled&&this.settleT>0.55)||(hurry&&this.settleT>0.25))this.nextTurn();}
    // камера
    const tx=this.projs.length?this.projs[this.projs.length-1].x:(this.order.length?this.cur().x:WORLD_W/2);
    this.camX+=(tx-this.camX)*Math.min(1,dt*3.2);
    this.camClamp();
    this.uiAcc+=dt;
    if(this.uiAcc>0.1){this.uiAcc=0;this.emit();}
  }
  updateParticles(dt){
    for(let i=this.particles.length-1;i>=0;i--){
      const p=this.particles[i];p.life-=dt;
      if(p.life<=0){this.particles.splice(i,1);continue;}
      p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}
    if(this.particles.length>620)this.particles.splice(0,this.particles.length-620);
    for(let i=this.dmgNums.length-1;i>=0;i--){
      const d=this.dmgNums[i];d.life-=dt;d.y-=34*dt;
      if(d.life<=0)this.dmgNums.splice(i,1);}
  }
  /* ================= РЕНДЕР ================= */
  render(){
    const c=this.ctx;
    c.setTransform(this.dpr,0,0,this.dpr,0,0);
    const cw=this.cw,ch=this.ch,m=this.map;
    const inferno=m==="inferno",frost=m==="frost",jungle=m==="jungle";
    // небо
    const skyCols=inferno?["#12060a","#2a0d10","#4a1810","#6e2a12"]
      :frost?["#040814","#0a1526","#14283e","#1e3a52"]
      :jungle?["#061410","#0c2418","#163822","#2c5a30"]
      :["#070b16","#122036","#2c2a33","#4a2c1c"];
    const sky=c.createLinearGradient(0,0,0,ch);
    sky.addColorStop(0,skyCols[0]);sky.addColorStop(0.45,skyCols[1]);
    sky.addColorStop(0.78,skyCols[2]);sky.addColorStop(1,skyCols[3]);
    c.fillStyle=sky;c.fillRect(0,0,cw,ch);
    const customBg=this.spriteOf("bg");
    if(customBg){const img=customBg.img;
      const ir=img.naturalWidth/img.naturalHeight,scr=cw/ch;
      let dw=cw,dh=ch,dx=0,dy=0;
      if(ir>scr){dw=ch*ir;dx=(cw-dw)/2;}else{dh=cw/ir;dy=(ch-dh)/2;}
      c.drawImage(img,dx,dy,dw,dh);}
    const shk=this.paused?0:this.shake;
    const shx=(Math.random()-0.5)*shk,shy=(Math.random()-0.5)*shk;
    const S=this.scale*this.zoom;
    c.save();
    c.translate(cw/2-this.camX*S+shx*S,ch/2-this.camY*S+shy*S);
    c.scale(S,S);
    const xMin=this.camX-cw/(2*S)-80,xMax=this.camX+cw/(2*S)+80;
    // звёзды и туманности
    if(!customBg&&!inferno){
      for(const nb of this.nebulae){
        const g=c.createRadialGradient(nb.x,nb.y,10,nb.x,nb.y,nb.r);
        g.addColorStop(0,nb.color);g.addColorStop(1,"rgba(0,0,0,0)");
        c.fillStyle=g;c.beginPath();c.arc(nb.x,nb.y,nb.r,0,Math.PI*2);c.fill();}
      for(const s of this.stars){
        const tw=0.4+0.6*Math.abs(Math.sin(this.time*1.4+s.tw));
        c.fillStyle=`rgba(235,240,255,${0.5*tw})`;c.fillRect(s.x,s.y,s.s,s.s);}
      for(const s of this.brightStars){
        const tw=0.5+0.5*Math.sin(this.time*2+s.tw);
        c.fillStyle=`rgba(240,248,255,${0.75+0.25*tw})`;
        c.beginPath();c.arc(s.x,s.y,s.s*0.8,0,Math.PI*2);c.fill();
        c.strokeStyle=`rgba(220,235,255,${0.35*tw})`;c.lineWidth=1;
        const L=s.s*(3+tw*3);
        c.beginPath();c.moveTo(s.x-L,s.y);c.lineTo(s.x+L,s.y);
        c.moveTo(s.x,s.y-L);c.lineTo(s.x,s.y+L);c.stroke();}
    }else if(!customBg&&inferno){
      // пепел в воздухе
      for(const s of this.stars){if(s.y>300)continue;
        const tw=0.3+0.4*Math.abs(Math.sin(this.time*0.8+s.tw));
        c.fillStyle=`rgba(255,140,80,${0.25*tw})`;c.fillRect(s.x,s.y+300,s.s,s.s);}
    }

        grad.addColorStop(0,"rgba(80,255,170,0)");
        grad.addColorStop(0.4,band===0?"rgba(80,255,170,0.10)":"rgba(120,140,255,0.08)");
        grad.addColorStop(1,"rgba(80,255,170,0)");

        for(let x=xMin;x<=xMax;x+=24)c.lineTo(x,baseY+Math.sin(x*0.004+this.time*(0.5+band*0.3))*34+Math.sin(x*0.011-this.time*0.8)*12);
        for(let x=xMax;x>=xMin;x-=24)c.lineTo(x,baseY+130+Math.sin(x*0.004+this.time*(0.5+band*0.3))*34);
        c.closePath();c.fill();}

        const g=c.createLinearGradient(bx,0,bx+180,700);

        c.fillStyle=g;c.beginPath();

        c.fillStyle=g;c.beginPath();c.arc(MOON_X,120,200*mg,0,Math.PI*2);c.fill();
        c.fillStyle="#c8402a";c.beginPath();c.arc(MOON_X,120,34,0,Math.PI*2);c.fill();
        c.fillStyle="rgba(80,10,5,0.5)";
        c.beginPath();c.arc(MOON_X-10,112,7,0,Math.PI*2);c.arc(MOON_X+12,128,5,0,Math.PI*2);c.fill();
      }else{

    // сталактиты и лианы (за ландшафтом)
    if(frost)for(const st of this.stalactites){
      if(st.x<xMin-40||st.x>xMax+40)continue;

      for(const[ox,wmul,lmul]of[[-st.w*0.5,0.6,0.6],[0,1,1],[st.w*0.5,0.55,0.5]]){

      if(st.x<xMin-40||st.x>xMax+40)continue;
      const baseY=this.surface(st.x);if(baseY>=WORLD_H)continue;
      const g=c.createLinearGradient(st.x,baseY,st.x,baseY-st.len);
      if(frost){g.addColorStop(0,"#2a4d6e");g.addColorStop(1,"#9fdcff");}
      else{g.addColorStop(0,"#241a16");g.addColorStop(1,"#5a4a40");}
      c.fillStyle=g;
      for(const[ox,wmul,lmul,lean]of[[-st.w*0.55,0.6,0.62,-0.25],[0,1,1,st.lean],[st.w*0.55,0.55,0.5,0.3]]){
        c.beginPath();
        c.moveTo(st.x+ox-st.w*0.5*wmul,baseY+2);
        c.quadraticCurveTo(st.x+ox-st.w*0.16*wmul,baseY-st.len*lmul*0.55,st.x+ox+lean*st.len*0.2,baseY-st.len*lmul);
        c.quadraticCurveTo(st.x+ox+st.w*0.2*wmul,baseY-st.len*lmul*0.5,st.x+ox+st.w*0.5*wmul,baseY+2);
        c.closePath();c.fill();}
      if(frost){c.fillStyle="rgba(255,255,255,0.75)";
        c.beginPath();c.arc(st.x+st.lean*st.len*0.2,baseY-st.len,1.8,0,Math.PI*2);c.fill();}
      else{const gl=0.5+0.3*Math.sin(this.time*3+st.x);
        c.fillStyle=`rgba(255,120,40,${gl})`;
        c.beginPath();c.arc(st.x+st.lean*st.len*0.2,baseY-st.len,1.6,0,Math.PI*2);c.fill();}}
    // огненные столбы
    if(inferno)for(const px of this.firePillars){
      if(px<xMin-60||px>xMax+60)continue;
      const gy=this.surface(px);if(gy>=WORLD_H)continue;
      const hgt=120+Math.sin(this.time*2.2+px)*26;
      const g=c.createLinearGradient(0,gy,0,gy-hgt);
      g.addColorStop(0,"rgba(255,140,50,0.5)");g.addColorStop(0.5,"rgba(255,90,30,0.2)");g.addColorStop(1,"rgba(255,90,30,0)");
      c.fillStyle=g;
      const w=16+Math.sin(this.time*3.1+px)*4;
      c.beginPath();
      c.moveTo(px-w,gy);
      c.quadraticCurveTo(px-w*0.5,gy-hgt*0.6,px+Math.sin(this.time*4+px)*6,gy-hgt);
      c.quadraticCurveTo(px+w*0.5,gy-hgt*0.6,px+w,gy);
      c.closePath();c.fill();
      c.fillStyle="rgba(255,180,80,0.7)";
      c.beginPath();c.ellipse(px,gy,w*0.7,4,0,0,Math.PI*2);c.fill();}
    // светлячки
    if(jungle)for(const ff of this.fireflies){
      if(ff.x<xMin-20||ff.x>xMax+20)continue;
      const a=0.4+0.4*Math.sin(this.time*3+ff.ph);
      const g=c.createRadialGradient(ff.x,ff.y,0.5,ff.x,ff.y,7);
      g.addColorStop(0,`rgba(220,255,150,${a})`);g.addColorStop(1,"rgba(220,255,150,0)");
      c.fillStyle=g;c.beginPath();c.arc(ff.x,ff.y,7,0,Math.PI*2);c.fill();}
    // очаги напалма
    for(const f of this.fires){
      const k=Math.max(0,1-f.t/f.dur);
      const g=c.createRadialGradient(f.x,f.y-6,4,f.x,f.y-6,f.r*1.1);
      g.addColorStop(0,`rgba(255,140,50,${0.32*k})`);g.addColorStop(1,"rgba(255,120,40,0)");
      c.fillStyle=g;c.beginPath();c.arc(f.x,f.y-6,f.r*1.1,0,Math.PI*2);c.fill();
      c.fillStyle=`rgba(255,140,42,${0.4*k})`;
      c.beginPath();c.ellipse(f.x,f.y,f.r*0.68,5.5,0,0,Math.PI*2);c.fill();}
    // деревья
    for(const t of this.trees)if(t.alive)this.drawTree(c,t);
    // башни
    this.drawTower(c,WORLD_W*0.145,0);
    this.drawTower(c,WORLD_W*0.855,1);
    // плот
    this.drawRaft(c);
    // ящики
    for(const cr of this.crates)this.drawCrate(c,cr);
    // ульта-сущности
    this.drawUltEntities(c);
    // могилы и герои
    for(const h of this.heroes)if(!h.alive&&h.y<WORLD_H+500)this.drawGrave(c,h);
    const active=this.screen==="game"&&this.order.length?this.cur():null;
    for(const h of this.heroes)if(h.alive)this.drawHero(c,h,h===active);
    // снаряды
    for(const p of this.projs)this.drawProjectile(c,p);
    // лучи
    for(const b of this.beams){
      const a=clamp(b.t/0.4,0,1);
      c.globalAlpha=a;
      c.strokeStyle="rgba(255,110,40,0.35)";c.lineWidth=13;
      c.beginPath();c.moveTo(b.x1,b.y1);c.lineTo(b.x2,b.y2);c.stroke();
      c.strokeStyle="#ffd27b";c.lineWidth=4.5;
      c.beginPath();c.moveTo(b.x1,b.y1);c.lineTo(b.x2,b.y2);c.stroke();
      c.strokeStyle="#fff6dc";c.lineWidth=1.6;
      c.beginPath();c.moveTo(b.x1,b.y1);c.lineTo(b.x2,b.y2);c.stroke();
      c.globalAlpha=1;}
    // прицелы
    if(this.screen==="game"&&active&&active.team===0&&active.alive){
      if(this.phase==="aim"&&!this.blinkMode&&!this.ultAim)this.drawAim(c,active);
      if(this.blinkMode)this.drawBlink(c,active);
      if(this.ultAim)this.drawUltAim(c,active);}
    this.drawParticles(c);
    // числа урона
    for(const d of this.dmgNums){
      c.globalAlpha=clamp(d.life,0,1);
      c.font=`800 ${d.size}px "Rubik", sans-serif`;c.textAlign="center";
      c.lineWidth=3;c.strokeStyle="rgba(10,8,4,0.85)";
      c.strokeText(d.text,d.x,d.y);
      c.fillStyle=d.color;c.fillText(d.text,d.x,d.y);
      c.globalAlpha=1;}
    c.restore();
    // вспышки и виньетка
    if(this.whiteFlash>0.02){c.fillStyle=`rgba(255,250,235,${0.5*this.whiteFlash})`;c.fillRect(0,0,cw,ch);}
    if(this.redFlash>0.02){
      const rf=c.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.3,cw/2,ch/2,Math.max(cw,ch)*0.72);
      rf.addColorStop(0,"rgba(255,40,20,0)");rf.addColorStop(1,`rgba(255,40,20,${0.4*this.redFlash})`);
      c.fillStyle=rf;c.fillRect(0,0,cw,ch);}
    const v=c.createRadialGradient(cw/2,ch/2,Math.min(cw,ch)*0.42,cw/2,ch/2,Math.max(cw,ch)*0.75);
    v.addColorStop(0,"rgba(0,0,0,0)");v.addColorStop(1,"rgba(0,0,0,0.5)");
    c.fillStyle=v;c.fillRect(0,0,cw,ch);
  }
  drawMountains(c,xMin,xMax,color,baseY,amp){
    c.fillStyle=color;c.beginPath();c.moveTo(xMin,WORLD_H+40);
    const step=46;
    for(let x=Math.floor(xMin/step)*step;x<=xMax;x+=step){
      const n=Math.sin(x*0.006+baseY)*0.6+Math.sin(x*0.017+baseY*0.7)*0.4;
      c.lineTo(x,baseY-(n*0.5+0.5)*amp);}
    c.lineTo(xMax,WORLD_H+40);c.closePath();c.fill();
    // снежные/пепельные вершины
    c.fillStyle=this.map==="frost"?"rgba(220,240,255,0.12)":this.map==="inferno"?"rgba(255,110,50,0.08)":"rgba(255,255,255,0.05)";
    c.beginPath();
    for(let x=Math.floor(xMin/step)*step;x<=xMax;x+=step){
      const n=Math.sin(x*0.006+baseY)*0.6+Math.sin(x*0.017+baseY*0.7)*0.4;
      const y=baseY-(n*0.5+0.5)*amp;
      if(x===Math.floor(xMin/step)*step)c.moveTo(x,y+18);
      c.lineTo(x,y);c.lineTo(x+step*0.5,y+14);}
    c.lineTo(xMax,baseY);c.lineTo(xMin,baseY);c.closePath();c.fill();
  }
  cavePalette(){
    return this.map==="frost"?{top:"#16283c",deep:"#060d18",layer:"rgba(140,190,230,0.06)",crack:"rgba(120,220,255,0.35)"}
      :this.map==="jungle"?{top:"#1c2414",deep:"#0a0e06",layer:"rgba(160,200,120,0.05)",crack:"rgba(140,220,120,0.25)"}
      :this.map==="inferno"?{top:"#2a120c",deep:"#0c0402",layer:"rgba(255,140,70,0.06)",crack:"rgba(255,120,40,0.5)"}
      :{top:"#241a10",deep:"#0c0805",layer:"rgba(200,160,100,0.05)",crack:"rgba(255,140,60,0.35)"};
  }
  drawCaveBackdrop(c,xMin,xMax){
    const p=this.cavePalette();
    const g=c.createLinearGradient(0,600,0,WORLD_H+80);
    g.addColorStop(0,p.top);g.addColorStop(1,p.deep);
    c.fillStyle=g;c.fillRect(xMin,600,xMax-xMin,WORLD_H+80-600);
    c.fillStyle=p.layer;
    for(let y=640;y<WORLD_H;y+=38){
      c.beginPath();c.moveTo(xMin,y);
      for(let x=xMin;x<=xMax;x+=40)c.lineTo(x,y+Math.sin(x*0.015+y*0.6)*5);
      c.lineTo(xMax,y+9);c.lineTo(xMin,y+9);c.fill();}
    // трещины у лавы
    for(let x=Math.floor(xMin/90)*90;x<xMax;x+=90){
      const r=mulberry32(x*7+3);
      const y=LAVA_TOP+10+r()*20;
      const gl=0.5+0.5*Math.sin(this.time*2.4+x*0.3);
      c.strokeStyle=p.crack;c.globalAlpha=0.4+0.5*gl;c.lineWidth=1.6;
      c.beginPath();c.moveTo(x,y);
      c.lineTo(x+8+r()*10,y+6);c.lineTo(x+4,y+14);c.stroke();
      c.globalAlpha=1;}
  }
  drawSideWall(c,side,xa,xb,yBot){
    const p=side===0
      ?(this.map==="frost"?["#2e4a66","#101d2e"]:this.map==="jungle"?["#3a4020","#141808"]:this.map==="inferno"?["#3a2018","#140a06"]:["#4a3826","#1c130a"])
      :(this.map==="frost"?["#263e58","#0c1826"]:this.map==="jungle"?["#303818","#101406"]:this.map==="inferno"?["#301812","#100804"]:["#3e2c1e","#16100a"]);
    const g=c.createLinearGradient(xa,0,xb,0);
    g.addColorStop(side===0?1:0,p[0]);g.addColorStop(side===0?0:1,p[1]);
    c.fillStyle=g;c.fillRect(xa,180,xb-xa,Math.max(yBot,WORLD_H)-180+60);
    c.fillStyle="rgba(0,0,0,0.14)";
    for(let y=220;y<WORLD_H;y+=42){
      c.beginPath();c.moveTo(xa,y);
      for(let x=xa;x<=xb;x+=30)c.lineTo(x,y+Math.sin(x*0.02+y)*4);
      c.lineTo(xb,y+8);c.lineTo(xa,y+8);c.fill();}
    c.fillStyle="rgba(0,0,0,0.3)";
    c.fillRect(side===0?xb-6:xa,180,6,Math.max(yBot,WORLD_H)-120);
  }
  drawLava(c,xMin,xMax){
    const T=LAVA_TOP;
    const glow=c.createLinearGradient(0,T-110,0,T+4);
    glow.addColorStop(0,"rgba(255,90,20,0)");glow.addColorStop(1,"rgba(255,120,30,0.25)");
    c.fillStyle=glow;c.fillRect(xMin,T-110,xMax-xMin,114);
    const g=c.createLinearGradient(0,T,0,WORLD_H+40);
    g.addColorStop(0,"#ffd66b");g.addColorStop(0.18,"#ff8c2a");
    g.addColorStop(0.55,"#d63c14");g.addColorStop(1,"#4a0e04");
    c.fillStyle=g;c.beginPath();c.moveTo(xMin,WORLD_H+40);
    for(let x=xMin;x<=xMax;x+=8)
      c.lineTo(x,T+Math.sin(x*0.021+this.time*2.1)*3+Math.sin(x*0.047-this.time*1.4)*2);
    c.lineTo(xMax,WORLD_H+40);c.closePath();c.fill();
    const span=Math.max(1,xMax-xMin);
    for(let i=0;i<14;i++){
      const bx=xMin+((i*173.3+this.time*16)%span);
      const by=T+8+((i*53)%24)+Math.sin(this.time*3+i)*3;
      const br=2+(i%3)+Math.sin(this.time*4+i*2)*1.2;
      c.fillStyle="rgba(255,224,130,0.5)";
      c.beginPath();c.arc(bx,by,Math.max(0.6,br),0,Math.PI*2);c.fill();}
    c.strokeStyle="rgba(255,232,150,0.85)";c.lineWidth=2;
    c.beginPath();let started=false;
    for(let x=xMin;x<=xMax;x+=8){
      const y=T+Math.sin(x*0.021+this.time*2.1)*3+Math.sin(x*0.047-this.time*1.4)*2;
      if(!started){c.moveTo(x,y);started=true;}else c.lineTo(x,y);}
    c.stroke();
  }
  drawWater(c){
    if(!this.hasLake)return;
    const level=this.waterY;
    const sa=this.lakeL,sb=this.lakeR;
    const frozen=this.map==="frost";
    const wave=x=>level+Math.sin(x*0.06+this.time*1.6)*1.3+Math.sin(x*0.023-this.time*1.1)*0.8;
    // тело: верх — вода, низ повторяет рельеф (затапливает кратеры)
    const g=c.createLinearGradient(0,level,0,level+130);
    if(frozen){g.addColorStop(0,"rgba(200,235,252,0.92)");g.addColorStop(0.35,"rgba(130,190,228,0.75)");g.addColorStop(1,"rgba(40,90,145,0.6)");}
    else if(this.map==="jungle"){g.addColorStop(0,"rgba(120,195,115,0.85)");g.addColorStop(0.4,"rgba(40,110,70,0.8)");g.addColorStop(1,"rgba(8,45,35,0.8)");}
    else if(this.map==="inferno"){g.addColorStop(0,"rgba(230,90,40,0.9)");g.addColorStop(0.4,"rgba(150,30,20,0.85)");g.addColorStop(1,"rgba(50,5,8,0.85)");}
    else{g.addColorStop(0,"rgba(95,185,240,0.9)");g.addColorStop(0.4,"rgba(45,120,190,0.8)");g.addColorStop(1,"rgba(12,45,100,0.78)");}
    c.fillStyle=g;c.beginPath();
    c.moveTo(sa,frozen?level:wave(sa));
    for(let x=sa;x<=sb;x+=3)c.lineTo(x,frozen?level:wave(x));
    for(let x=sb;x>=sa;x-=3){const h=this.heights[x];c.lineTo(x,Math.min(h>WORLD_H?1005:h,WORLD_H+5));}
    c.closePath();c.fill();
    // поверхность
    const infW=this.map==="inferno";
    c.strokeStyle=frozen?"rgba(255,255,255,0.92)":infW?"rgba(255,180,90,0.9)":this.map==="jungle"?"rgba(200,255,210,0.85)":"rgba(190,232,255,0.9)";
    c.lineWidth=frozen?2.6:1.8;
    c.beginPath();
    for(let x=sa,first=true;x<=sb;x+=3){
      const y=frozen?level:wave(x);
      if(first){c.moveTo(x,y);first=false;}else c.lineTo(x,y);}
    c.stroke();
    // береговая пена
    c.fillStyle=frozen?"rgba(240,252,255,0.85)":"rgba(215,240,255,0.8)";
    for(const edge of[sa,sb]){
      const ey=this.heights[clamp(edge,0,WORLD_W-1)];
      if(Math.abs(ey-level)<26)for(let i=0;i<3;i++){
        const bx=edge+(edge===sa?-1:1)*(2+i*3.4)+Math.sin(this.time*2.6+i)*1.6;
        c.beginPath();c.arc(bx,Math.min(ey,level+3),2.6-i*0.6,0,Math.PI*2);c.fill();}}
    if(frozen){
      c.strokeStyle="rgba(235,250,255,0.4)";c.lineWidth=1;
      for(let i=0;i<8;i++){const cx2=sa+30+i*((sb-sa)/8);
        if(this.surface(cx2)<=level)continue;
        c.beginPath();c.moveTo(cx2,level+3);c.lineTo(cx2+9,level+11);c.lineTo(cx2+4,level+20);c.stroke();}
    }else{
      c.fillStyle=infW?"rgba(255,200,120,0.5)":this.map==="jungle"?"rgba(190,255,200,0.4)":"rgba(215,242,255,0.5)";
      const w=Math.max(1,sb-sa);
      for(let i=0;i<7;i++){
        const gx=sa+((this.time*30+i*(w/7)*1.6)%w);
        if(this.surface(gx)>level)c.fillRect(gx,level+4+Math.sin(this.time*2+i)*1.6,13,1.5);}
      if(infW){
        for(let i=0;i<6;i++){
          const gx=sa+((i*(w/6))+Math.sin(this.time*1.3+i)*8);
          const gy=level+6+Math.abs(Math.sin(this.time*2.2+i*2))*10;
          if(this.surface(gx)>level){
            c.strokeStyle="rgba(255,160,80,0.6)";c.lineWidth=1.2;
            c.beginPath();c.arc(gx,gy,2.2+Math.sin(this.time*3+i)*0.8,0,Math.PI*2);c.stroke();}}}
    }
  }
  blob(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();}
  drawTree(c,t){

      const tg=c.createLinearGradient(-3,0,3,0);

      c.fillStyle=tg;c.fillRect(-3,-16,6,16);

        const ty=-14-i*16,w=27-i*5.6;

        for(const mm of[-1,0,1]){c.beginPath();
          c.moveTo(mm*w*0.4-w*0.5,ty);

      c.fillStyle=t.side===1?"#2f6484":"#357c62";
      c.beginPath();c.moveTo(-8,-62+12);c.quadraticCurveTo(0,-100,8,-62+12);c.closePath();c.fill();
      c.fillStyle="#fff";c.beginPath();c.ellipse(0,-92,5,3,0,0,Math.PI*2);c.fill();
      c.restore();return;}
    if(m==="jungle"){ // пальма
      c.strokeStyle="#5a4426";c.lineWidth=5;
      c.beginPath();c.moveTo(0,0);
      c.quadraticCurveTo(6,-30,4+Math.sin(t.seed)*4,-58);c.stroke();
      const topX=4+Math.sin(t.seed)*4,topY=-58;
      for(let i=0;i<7;i++){
        const a=-Math.PI/2+(i-3)*0.42+Math.sin(this.time*1.2+t.seed+i)*0.05;
        const len=30+rng()*8;
        c.strokeStyle=i%2?"#2e7a2e":"#3e9438";c.lineWidth=3;
        c.beginPath();c.moveTo(topX,topY);
        c.quadraticCurveTo(topX+Math.cos(a)*len*0.6,topY+Math.sin(a)*len*0.5-6,topX+Math.cos(a)*len,topY+Math.sin(a)*len*0.6+8);
        c.stroke();}
      c.fillStyle="#6a4a26";
      c.beginPath();c.arc(topX-3,topY+3,3,0,Math.PI*2);c.arc(topX+3,topY+4,3,0,Math.PI*2);c.fill();
      c.restore();return;}
    if(m==="inferno"){ // мёртвое дерево
      c.strokeStyle="#241a14";c.lineWidth=4.5;
      c.beginPath();c.moveTo(0,0);c.lineTo(0,-36);c.stroke();
      c.lineWidth=2.6;
      c.beginPath();
      c.moveTo(0,-20);c.lineTo(-14,-36);
      c.moveTo(0,-27);c.lineTo(13,-44);
      c.moveTo(0,-36);c.lineTo(-8,-52);
      c.moveTo(0,-36);c.lineTo(9,-56);c.stroke();
      const gl=0.4+0.3*Math.sin(this.time*2.2+t.seed);
      c.fillStyle=`rgba(255,110,50,${gl})`;
      this.blob(c,-14,-37,1.8);this.blob(c,13,-45,1.8);this.blob(c,9,-57,1.8);
      c.restore();return;}
    // лиственное (каньон)
    const trunkH=46;
    const tg2=c.createLinearGradient(-4,0,4,0);
    tg2.addColorStop(0,"#241708");tg2.addColorStop(0.45,"#5a4026");tg2.addColorStop(1,"#1c1106");
    c.fillStyle=tg2;
    c.beginPath();c.moveTo(-5.4,0);
    c.quadraticCurveTo(-3.4,-trunkH*0.5,-2.6,-trunkH);
    c.lineTo(2.6,-trunkH);
    c.quadraticCurveTo(3.4,-trunkH*0.5,5.4,0);c.closePath();c.fill();
    c.strokeStyle="#3a2814";c.lineWidth=3;

  drawHeroTop(c,h,isActive,sp){
    // статусы над головой
    const topY=sp?sp.h+14:84;
    if(h.shield){
      const gl=0.5+0.3*Math.sin(this.time*5);
      c.strokeStyle=`rgba(232,208,240,${gl})`;c.lineWidth=2;

      c.beginPath();c.ellipse(h.x,h.y-40,20,42,0,0,Math.PI*2);c.stroke();c.setLineDash([]);}
    if(h.stunLeft>0){
      c.fillStyle="#ffe95c";
      for(let i=0;i<3;i++){
        const a=this.time*4+i*2.1;
        const sx=h.x+Math.cos(a)*12,sy=h.y-topY-8+Math.sin(a)*3;
        c.save();c.translate(sx,sy);c.rotate(a);
        c.beginPath();
        for(let k=0;k<5;k++){const aa=k*Math.PI*2/5-Math.PI/2;
          c.lineTo(Math.cos(aa)*4,Math.sin(aa)*4);
          c.lineTo(Math.cos(aa+Math.PI/5)*1.8,Math.sin(aa+Math.PI/5)*1.8);}
        c.closePath();c.fill();c.restore();}}
    if(h.buffMult>1){
      c.fillStyle="rgba(40,40,50,0.6)";

        const fx=h.x-8+i*8,fy=h.y-50-Math.abs(Math.sin(this.time*6+i))*8;
        c.beginPath();c.moveTo(fx,fy+10);
        c.quadraticCurveTo(fx-4,fy+4,fx,fy);

      c.fillStyle="#f5d67b";c.font='800 11px "Rubik",sans-serif';c.textAlign="center";
      c.fillText("×2",h.x,h.y-64);}
    // взмах ближнего боя
    if(h.swingT>0){
      const wdef=weaponById[h.weapon];
      const a=this.aimAngle,k=h.swingT/0.3;

      c.closePath();c.fill();
      c.globalAlpha=k*0.9;c.strokeStyle="#fff2cf";c.lineWidth=3;
      c.beginPath();c.arc(h.x,h.y-16,(wdef.range||60)*(1.15-k*0.15),a-0.7,a+0.7);c.stroke();
      c.restore();}
    // HP + имя
    const pct=h.hp/h.maxHp,bw=46;
    c.fillStyle="rgba(8,10,16,0.85)";
    c.fillRect(h.x-bw/2-1,h.y-topY,bw+2,7);
    c.fillStyle=pct>0.5?(h.team===0?"#8fce4f":"#e06a4a"):pct>0.25?"#e8c14a":"#e05038";
    c.fillRect(h.x-bw/2,h.y-topY+1,bw*pct,5);
    c.strokeStyle=isActive?"rgba(245,214,123,0.95)":h.team===0?"rgba(159,212,90,0.6)":"rgba(224,80,56,0.6)";
    c.lineWidth=1;c.strokeRect(h.x-bw/2-1,h.y-topY,bw+2,7);
    c.font=`${isActive?"800":"600"} 11px "Rubik", sans-serif`;c.textAlign="center";
    c.fillStyle=isActive?"#f5d67b":h.team===0?"rgba(207,232,168,0.85)":"rgba(240,160,142,0.85)";
    c.strokeStyle="rgba(8,10,16,0.9)";c.lineWidth=2.5;
    c.strokeText(h.name,h.x,h.y-topY-5);
    c.fillText(h.name,h.x,h.y-topY-5);
    if(h.flashT>0){
      c.fillStyle=`rgba(255,255,255,${h.flashT*3.4})`;

  }

};

  openWorkshop(){workshopOpen=true;renderWorkshop();},
  closeWorkshop(){workshopOpen=false;overlayEl.style.display="none";},
  wsFile(key,input){
    const f=input.files&&input.files[0];if(!f)return;
    processImageFile(f).then(res=>{
      const slot=SLOT_DEFS.find(s=>s.key===key);
      let cfg;
      if(slot.kind==="bg")cfg={dataUrl:res.dataUrl,w:0,h:0,offY:0};
      else if(slot.kind==="hero"){const h=slot.dh;cfg={dataUrl:res.dataUrl,w:clamp(Math.round(h*res.aspect),14,240),h:h,offY:0};}
      else cfg={dataUrl:res.dataUrl,w:slot.dw,h:slot.dh,offY:0};
      engine.applySprite(key,cfg);renderWorkshop();
    }).catch(()=>alert("Не удалось прочитать изображение"));
  },
  wsSlider(key,field,val){
    const d=engine.getWorkshopData();
    if(!d[key])return;
    d[key][field]=parseFloat(val);
    engine.applySprite(key,d[key]);
    const out=document.getElementById("wsv-"+key+"-"+field);
    if(out)out.textContent=val;
  },
  wsReset(key){engine.applySprite(key,null);renderWorkshop();},
};

function drawMapPreview(cv,id){
  const c=cv.getContext("2d");const w=cv.width,h=cv.height;
  const pal={canyon:["#122036","#4a2c1c","#3f7433","#a34a2e","#4a86b0"],frost:["#0a1526","#1e3a52","#9fc4e0","#7fa8cc","#2a4d6e"],
    jungle:["#0c2418","#2c5a30","#2e7a2e","#46402a","#3e7a30"],inferno:["#2a0d10","#6e2a12","#3a2018","#241a14","#c8402a"]}[id];
  const g=c.createLinearGradient(0,0,0,h);g.addColorStop(0,pal[0]);g.addColorStop(1,pal[1]);
  c.fillStyle=g;c.fillRect(0,0,w,h);
  const rng=mulberry32(id.length*77);
  c.fillStyle=id==="inferno"?"rgba(200,64,42,0.9)":"rgba(246,234,208,0.9)";
  c.beginPath();c.arc(w*0.75,h*0.25,7,0,Math.PI*2);c.fill();
  const hill=(base,amp,col)=>{c.fillStyle=col;c.beginPath();c.moveTo(0,h);
    for(let x=0;x<=w;x+=6)c.lineTo(x,base+Math.sin(x*0.05+rng()*9)*amp*0.4-Math.abs(Math.sin(x*0.021+base))*amp);
    c.lineTo(w,h);c.closePath();c.fill();};
  hill(h*0.62,10,pal[2]);hill(h*0.66,9,pal[3]);
  c.fillStyle=id==="frost"?"rgba(200,235,252,0.85)":id==="inferno"?"rgba(230,90,40,0.85)":id==="jungle"?"rgba(120,195,115,0.8)":"rgba(95,185,240,0.85)";
  c.beginPath();c.moveTo(w*0.36,h);c.lineTo(w*0.4,h*0.72);c.lineTo(w*0.6,h*0.72);c.lineTo(w*0.64,h);c.closePath();c.fill();
  c.fillStyle=pal[4];
  for(let i=0;i<4;i++){const tx=w*(0.12+i*0.22)+(rng()-0.5)*10;
    c.beginPath();c.moveTo(tx,h*0.6);c.lineTo(tx+4,h*0.44);c.lineTo(tx+8,h*0.6);c.closePath();c.fill();}
  c.fillStyle="rgba(255,140,50,0.9)";c.fillRect(0,h-5,w,5);
}

              <span style="display:block;font-size:11px;color:#93a0b8">${w.ammo===-1?"вечно":w.ammo+" зар."}</span></span>
              <span class="kbd" style="margin-left:auto;font-size:10px;padding:1px 6px">${i+2}</span></div>`;}).join("")}</div>
        <p style="font-size:13px;color:#7a86a0;margin:12px 0 0">Слот <span class="kbd" style="font-size:10px;padding:1px 6px">1</span> — фирменное оружие героя: у Снайпера дальний выстрел, у Лины луч Лагуны, у Джаггернаута Омниклинок.</p>
        <div style="height:1px;margin:20px 0;background:linear-gradient(90deg,transparent,#3a4763,transparent)"></div>
        <div class="font-display font-800" style="font-size:13px;letter-spacing:.28em;color:#e8b64a;margin-bottom:12px">ЛАВКА</div>
        <div style="display:flex;flex-direction:column;gap:8px">
          ${ITEMS.map(it=>`<div style="display:flex;align-items:center;gap:12px">
            <span class="clip-angled-sm panel-gold" style="flex-shrink:0;width:40px;height:40px;display:grid;place-items:center;color:#f5d67b">${IC.item("w-6 h-6",it.id)}</span>
            <span style="font-size:13.5px;line-height:1.3;min-width:0"><b class="font-display font-700" style="font-size:14px;color:#e8ddc4">${it.name}</b> <span style="color:#f5d67b;font-weight:700">${it.cost} з.</span>
            <span style="display:block;font-size:12.5px;color:#93a0b8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.desc}</span></span></div>`).join("")}</div>
        <p style="font-size:13px;color:#7a86a0;margin:20px 0 0">Побеждает команда, истребившая противника. На телефоне: тяни палец для наведения, кнопки движения — слева внизу.</p>
      </div></div></div></div>`;
  requestAnimationFrame(()=>{for(const m of MAPS){const cv=document.getElementById("pv-"+m.id);if(cv)drawMapPreview(cv,m.id);}});
  const mq=window.matchMedia("(max-width:900px)");
  const grid=menuEl.querySelector(".menu-grid");
  if(grid)grid.style.gridTemplateColumns=mq.matches?"1fr":"1.12fr .88fr";
}
function renderWorkshop(){
  overlayEl.style.display="grid";
  overlayEl.style.background="rgba(5,7,12,0.78)";
  const data=engine.getWorkshopData();
  const rows=SLOT_DEFS.map(slot=>{
    const cfg=data[slot.key];
    const isBg=slot.kind==="bg";
    const preview=cfg?`<img src="${cfg.dataUrl}" style="max-width:84px;max-height:84px;object-fit:contain;image-rendering:auto;display:block">`:`<span style="color:#4a5164;font-size:11px">нет файла</span>`;
    const sliders=cfg&&!isBg?["w","h","offY"].map(f=>{
      const labels={w:"Ширина",h:"Высота",offY:"Сдвиг Y"};
      const min=f==="offY"?-60:10,max=f==="offY"?60:240;
      return `<label style="display:flex;align-items:center;gap:8px;font-size:11.5px;color:#93a0b8">${labels[f]}
        <input type="range" min="${min}" max="${max}" step="1" value="${cfg[f]}" style="flex:1" oninput="API.wsSlider('${slot.key}','${f}',this.value)">
        <span id="wsv-${slot.key}-${f}" style="width:34px;text-align:right;color:#f0dcae;font-weight:700">${cfg[f]}</span></label>`;}).join(""):"";
    const badge=slot.kind==="hero"?["ГЕРОЙ","#9fd45a","#1c2a12"]:slot.kind==="obj"?["ОБЪЕКТ","#f5d67b","#2a2410"]:["ФОН","#7fc4e8","#12202e"];
    return `<div class="clip-angled-sm panel" style="padding:14px;display:flex;gap:14px;align-items:flex-start">
      <div style="flex-shrink:0;width:90px;height:90px;display:grid;place-items:center;background:#0a0e16;border:1px solid #2a3448">${preview}</div>
      <div style="min-width:0;flex:1">
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
          <span class="font-display font-800" style="font-size:14px;color:#f0dcae">${slot.name}</span>
          <span style="font-size:10px;font-weight:700;letter-spacing:.15em;padding:2px 8px;color:${badge[1]};background:${badge[2]}">${badge[0]}</span></div>
        <div style="font-size:11.5px;color:#7a86a0;margin:3px 0 8px">${slot.hint}${slot.kind==="hero"?" · якорь — низ по центру":""}</div>
        <div style="display:flex;flex-direction:column;gap:5px">${sliders}</div>
        <div style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <label class="btn-iron" style="padding:6px 14px;font-size:12px;cursor:pointer">ЗАГРУЗИТЬ PNG
            <input type="file" accept="image/*" style="display:none" onchange="API.wsFile('${slot.key}',this)"></label>
          ${cfg?`<button class="btn-iron" onclick="API.wsReset('${slot.key}')" style="padding:6px 14px;font-size:12px;color:#ff8c6b">СБРОС</button>`:""}
          ${isBg&&cfg?'<span style="font-size:11px;color:#7a86a0">растягивается на весь экран</span>':""}</div></div></div>`;}).join("");
  overlayEl.innerHTML=`<div onclick="if(event.target===this)API.closeWorkshop()" style="position:absolute;inset:0;display:grid;place-items:center;padding:12px">
    <div class="panel-angled anim-pop" style="width:100%;max-width:860px;max-height:92vh;overflow-y:auto">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 24px;border-bottom:1px solid #38466a">
        <div><div class="font-display" style="font-weight:900;font-size:22px;letter-spacing:.14em;color:#f5d67b">МАСТЕРСКАЯ</div>
          <div style="font-size:13px;color:#93a0b8;margin-top:2px">Свои PNG-модели героев, подарки и фон · хранится в браузере · габариты в мировых px (герой ≈ 40×68)</div></div>
        <button class="btn-iron" onclick="API.closeWorkshop()" style="width:44px;height:44px;display:grid;place-items:center;font-size:24px;line-height:1">×</button></div>
      <div style="padding:20px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px">${rows}</div>
      <div style="padding:0 24px 20px;font-size:12.5px;color:#7a86a0">Формат: PNG с прозрачностью. Картинка сжимается до 512px автоматически. Ширина/высота задают размер на карте, сдвиг Y двигает модель вверх-вниз относительно земли.</div>
    </div></div>`;
}
function renderAll(){
  if(!SNAP){renderMenu();return;}
  if(SNAP.screen==="menu"){
    menuEl.style.display="block";hudEl.style.display="none";
    if(!workshopOpen)overlayEl.style.display="none";
    if(!workshopOpen)renderMenu();
    return;}
  menuEl.style.display="none";
  renderHUD();
  if(shopOpen&&SNAP.isPlayerTurn&&SNAP.phase==="aim")renderShop();
  else if(shopOpen){shopOpen=false;if(engine)engine.setShopOpen(false);}
  if(!workshopOpen)renderOverlays();
}

/* ================= СТАРТ ================= */
window.addEventListener("DOMContentLoaded",()=>{
  const cv=document.getElementById("cv");
  engine=new Engine(cv,snap=>{SNAP=snap;renderAll();});
  engine.onShopOpen=()=>{shopOpen=true;engine.setShopOpen(true);renderAll();};
  engine.onShopClose=()=>{shopOpen=false;engine.setShopOpen(false);renderAll();};
  sfx.ensure();
  renderMenu();
});
</script>
</body>
</html>
